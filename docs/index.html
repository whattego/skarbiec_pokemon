<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--surface-2:#f3f2ee;--ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s7:#6250d6;--s8:#e34948;
  --good:#0ca30c;--good-ink:#006300;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;
  --accent:#2a78d6;--accent-ink:#fff;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--surface-2:#232321;--ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s7:#9085e9;--s8:#e66767;
  --good-ink:#0ca30c;--accent:#3987e5;--shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--surface-2:#232321;--ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s7:#9085e9;--s8:#e66767;
  --good-ink:#0ca30c;--accent:#3987e5;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--grid)}
.bar{display:flex;align-items:center;gap:12px;height:56px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo svg{width:24px;height:24px}
.bar .meta{color:var(--muted);font-size:12px;margin-left:auto;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

nav.tabs::-webkit-scrollbar{display:none}

nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:24px 0 60px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px}

.muted{color:var(--muted)}

.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 16px;border-radius:10px;z-index:100;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}

.hide{display:none!important}

.drop{border:2px dashed var(--axis);border-radius:12px;padding:22px 16px;text-align:center;color:var(--ink-2)}

.job{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--grid)}

.job>img,.ph img{width:96px;border-radius:8px;object-fit:cover;background:var(--surface-2)}
.sc-card{display:grid;grid-template-columns:auto 52px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--grid)}
.sc-card .nm{overflow-wrap:anywhere}
.sc-card .badge{white-space:normal}
.sc-card:first-of-type{border-top:0}
.sc-card img{width:52px;border-radius:4px;background:var(--surface-2)}
.sc-card .ctl{grid-column:3;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sc-card select{width:100%;max-width:100%}
.sc-card input[type=number]{width:72px}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{border:0;padding:0;background:none;cursor:pointer;text-align:left;font-size:11px;color:var(--muted)}

<body>
<div id="app"></div>
<script>
'use strict';
/* ============================================================
   Skarbiec – panel inwestycyjny kart Pokémon
   Dane: publiczny cennik Cardmarketu (bot GitHub Actions) + twój zaszyfrowany skarbiec.
   Wszystko, co prywatne (watchlisty, portfel, historia), jest szyfrowane AES-256-GCM
   kluczem z twojego hasła (PBKDF2, 310 000 iteracji). Hasło nigdy nie opuszcza przeglądarki.
   ============================================================ */
const ITER = 310000;
const DEFAULT_SETTINGS = { drop_alert_pct: 10, card_drop_alert_pct: 25, dip_alert_pct: 20, profit_steps: [50, 100, 200, 400], weekly_summary: true, summary_weekday: 0, pf_metric: 'avg30', sell_min_pct: 90, track_min_eur: 1 };
const KIND = { S: 'Karta', D: 'Display / box', E: 'ETB', B: 'Booster', O: 'Inny sealed' };
const S = { pw: null, vault: null, vaultSha: null, vaultSalt: null, market: null, meta: null, catalog: null, catMap: null, tab: 'pulpit', wl: null, charts: [], readOnly: true, branch: null };

// ---------------- narzędzia ----------------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nfE = new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'EUR' });
const nfP0 = new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN', maximumFractionDigits: 0 });
const nfP2 = new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN' });
const E = v => v == null || isNaN(v) ? '—' : nfE.format(v);
const P = v => v == null || isNaN(v) ? '—' : (Math.abs(v) < 100 ? nfP2 : nfP0).format(v);
const pct = (a, b) => a != null && b ? (a - b) / b * 100 : null;
const PC = (p, plus = true) => p == null || isNaN(p) ? '—' : `${p > 0 && plus ? '+' : p < 0 ? '−' : ''}${Math.abs(p).toFixed(1).replace('.', ',')}%`;
const cls = p => p == null ? '' : p > 0.05 ? 'up' : p < -0.05 ? 'down' : '';
const arrow = p => p == null ? '' : p > 0.05 ? '▲ ' : p < -0.05 ? '▼ ' : '';
const dPL = d => d ? new Date(d + (d.length === 10 ? 'T12:00:00' : '')).toLocaleDateString('pl-PL', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const todayISO = () => new Date().toISOString().slice(0, 10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const keyOf = it => `${+it.id}${it.holo ? 'h' : ''}`;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function taxFreeFrom(iso) { const d = new Date(iso + 'T12:00:00Z'); const m = d.getUTCMonth() + 7; return new Date(Date.UTC(d.getUTCFullYear() + Math.floor(m / 12), m % 12, 1)).toISOString().slice(0, 10); }

// ---------------- kryptografia (zgodna z botem) ----------------
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const keyCache = new Map();
function deriveKey(pw, salt) {
  const id = pw + '|' + b64e(salt);
  if (!keyCache.has(id)) keyCache.set(id, (async () => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  })());
  return keyCache.get(id);
}
const pipe = async (u8, stream) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer());
async function decryptBlob(blob, pw) {
  const salt = b64d(blob.salt);
  const pt = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(blob.iv) }, await deriveKey(pw, salt), b64d(blob.ct)));
  return { obj: JSON.parse(new TextDecoder().decode(await pipe(pt, new DecompressionStream('gzip')))), salt };
}
async function encryptBlob(obj, pw, salt) {
  salt = salt || crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await pipe(new TextEncoder().encode(JSON.stringify(obj)), new CompressionStream('gzip'));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(pw, salt), data));
  return { v: 1, kdf: 'PBKDF2-SHA256', iter: ITER, salt: b64e(salt), iv: b64e(iv), ct: b64e(ct) };
}

// ---------------- GitHub (zapis zmian i uruchamianie bota) ----------------
const GH = {
  get api() { return ls.get('skarbiec_api') || 'https://api.github.com'; },
  get token() { return ls.get('skarbiec_token') || ''; },
  get repo() {
    const o = ls.get('skarbiec_repo'); if (o) return o;
    const m = location.hostname.match(/^([^.]+)\.github\.io$/); const seg = location.pathname.split('/').filter(Boolean)[0];
    return m && seg && !seg.endsWith('.html') ? `${m[1]}/${seg}` : '';
  },
  async call(path, opts = {}, repo = this.repo) {
    if (!repo || !this.token) throw new Error('Brak tokenu GitHub lub nazwy repozytorium (Ustawienia).');
    const r = await fetch(`${this.api}/repos/${repo}${path}`, { cache: 'no-store', ...opts, headers: { Authorization: `Bearer ${this.token}`, Accept: opts.raw ? 'application/vnd.github.raw' : 'application/vnd.github+json', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
    if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch {} throw new Error(`GitHub ${r.status}${m ? ': ' + m : ''}`); }
    return r.status === 204 ? null : opts.raw ? r.blob() : r.json();
  },
  async branch() { if (!S.branch) S.branch = (await this.call('')).default_branch || 'main'; return S.branch; },
  async getFile(path) {
    try { const j = await this.call(`/contents/${path}`); return { text: new TextDecoder().decode(b64d(j.content.replace(/\n/g, ''))), sha: j.sha }; }
    catch (e) { if (/ 404/.test(e.message)) return null; throw e; }
  },
  async putFile(path, text, sha, message) {
    const body = { message, content: b64e(new TextEncoder().encode(text)), branch: await this.branch() };
    if (sha) body.sha = sha;
    return this.call(`/contents/${path}`, { method: 'PUT', body: JSON.stringify(body) });
  },
  async runBot(test) {
    return this.call('/actions/workflows/bot.yml/dispatches', { method: 'POST', body: JSON.stringify({ ref: await this.branch(), ...(test ? { inputs: { test: 'true' } } : {}) }) });
  },
};
// zdjęcia kart: osobne, prywatne repozytorium (ten sam token)
const PHOTOS = {
  get repo() { return ls.get('skarbiec_photo_repo') || (GH.repo ? `${GH.repo.split('/')[0]}/skarbiec-foto` : ''); },
  branch: null,
  // zapisy po kolei: dwa równoległe zapisy do jednego repo kończą się „GitHub 409” (gałąź przesunęła się w międzyczasie)
  queue: Promise.resolve(),
  enqueue(fn) { const job = this.queue.then(fn); this.queue = job.catch(() => {}); return job; },
  put(path, blob, message) {
    return this.enqueue(async () => {
      if (!this.branch) this.branch = (await GH.call('', {}, this.repo)).default_branch || 'main';
      const body = JSON.stringify({ message, content: b64e(new Uint8Array(await blob.arrayBuffer())), branch: this.branch });
      for (let i = 0; ; i++) {
        try { return await GH.call(`/contents/${path}`, { method: 'PUT', body }, this.repo); }
        catch (e) { if (!/^GitHub 409\b/.test(e.message) || i >= 3) throw e; await new Promise(r => setTimeout(r, 800 * (i + 1))); }
      }
    });
  },
  // usuwa wiele plików JEDNYM commitem (Git Data API: drzewo z sha:null) – zamiast commita na każde zdjęcie
  async removeMany(paths, message) {
    paths = [...new Set(paths)].filter(Boolean); if (!paths.length) return 0;
    return this.enqueue(async () => {
      if (!this.branch) this.branch = (await GH.call('', {}, this.repo)).default_branch || 'main';
      for (let i = 0; ; i++) {
        try {
          const head = (await GH.call(`/git/ref/heads/${this.branch}`, {}, this.repo)).object.sha;
          const all = new Set((await GH.call(`/git/trees/${head}?recursive=1`, {}, this.repo)).tree.filter(t => t.type === 'blob').map(t => t.path));
          const del = paths.filter(p => all.has(p)); if (!del.length) return 0;
          const base = (await GH.call(`/git/commits/${head}`, {}, this.repo)).tree.sha;
          const tree = await GH.call('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: base, tree: del.map(path => ({ path, mode: '100644', type: 'blob', sha: null })) }) }, this.repo);
          const commit = await GH.call('/git/commits', { method: 'POST', body: JSON.stringify({ message, tree: tree.sha, parents: [head] }) }, this.repo);
          await GH.call(`/git/refs/heads/${this.branch}`, { method: 'PATCH', body: JSON.stringify({ sha: commit.sha }) }, this.repo);
          del.forEach(p => { this.urls.delete(p); this.miss.set(p, Date.now()); });
          return del.length;
        } catch (e) { if (!/^GitHub (409|422)\b/.test(e.message) || i >= 3) throw e; await new Promise(r => setTimeout(r, 800 * (i + 1))); }   // gałąź przesunęła się – od nowa
      }
    });
  },
  async list(prefixes) {   // [{path, size}] plików w prywatnym repo o podanych prefiksach
    if (!this.branch) this.branch = (await GH.call('', {}, this.repo)).default_branch || 'main';
    const t = await GH.call(`/git/trees/${this.branch}?recursive=1`, {}, this.repo);
    return t.tree.filter(x => x.type === 'blob' && prefixes.some(p => x.path.startsWith(p))).map(x => ({ path: x.path, size: x.size || 0 }));
  },
  urls: new Map(), miss: new Map(),
  url(path) {   // blob: URL do wyświetlenia (repo jest prywatne, więc przez API z tokenem)

async function loadEN() {
  if (!GH.token || !PHOTOS.repo) return;
  try {
    const all = await GH.call('/contents/en', {}, PHOTOS.repo).catch(e => { if (/ 404/.test(e.message)) return []; throw e; });
    if (all.some(f => f.name === 'history.json'))
      S.enHist = (await GH.call('/contents/en/history.json', { raw: true }, PHOTOS.repo).then(b => b.text()).then(JSON.parse).catch(() => null))?.h || [];
    // opt_<idListy>.json = wynik optymalizatora (komplet z wysyłką) – osobno, nie są cenami pojedynczych kart
    const optFiles = all.filter(f => /^opt_.*\.json$/.test(f.name));
    S.opt = (await Promise.all(optFiles.map(f => GH.call(`/contents/en/${encodeURIComponent(f.name)}`, { raw: true }, PHOTOS.repo).then(b => b.text()).then(JSON.parse).catch(() => null)))).filter(Boolean);
    // cmnums.json: kod i numer karty z tytułu produktu na Cardmarket (zbiera rozszerzenie) – do dopasowania kart JP/promo
    if (all.some(f => f.name === 'cmnums.json'))
      S.cmnums = (await GH.call('/contents/en/cmnums.json', { raw: true }, PHOTOS.repo).then(b => b.text()).then(JSON.parse).catch(() => null))?.p || {};
    // listed.json: wynik wystawiania na Cardmarket (pisze rozszerzenie) {items: {uid: {t, ok, price, qty, err, msg}}}
    S.listed = all.some(f => f.name === 'listed.json')
      ? (await GH.call('/contents/en/listed.json', { raw: true }, PHOTOS.repo).then(b => b.text()).then(JSON.parse).catch(() => null))?.items || {} : {};
    const files = all.filter(f => f.name.endsWith('.json') && !['targets.json', 'history.json', 'cmnums.json', 'verify.json', 'sell.json', 'listed.json', 'request.json'].includes(f.name) && !/^opt_/.test(f.name));
    const docs = await Promise.all(files.map(f => GH.call(`/contents/en/${encodeURIComponent(f.name)}`, { raw: true }, PHOTOS.repo).then(b => b.text()).then(JSON.parse).catch(() => null)));
    const m = new Map();
    for (const d of docs.filter(Boolean)) for (const [k, v] of Object.entries(d.items || {})) {

// ---------------- zapis skarbca ----------------
// Scalanie trzystronne: base = ostatnia zapisana wersja na tym urządzeniu, local = zmiany tutaj, remote = nowsza wersja z GitHuba
// (zmieniona np. na komputerze, gdy ty skanowałeś telefonem). Listy po kluczu: dodane/zmienione tutaj → biorę stąd,
// usunięte tutaj → usuwam, resztę zostawiam z GitHuba. Pozostałe pola: zmienione tutaj → stąd, inaczej z GitHuba.
const VAULT_KEYS = { portfolio: 'uid', watchlists: 'id', scans: 'path' };
function mergeVault(base, local, remote) {
  const out = { ...remote };
  for (const k of new Set([...Object.keys(local), ...Object.keys(remote)])) {
    const b = base[k], l = local[k], key = VAULT_KEYS[k];
    if (key && Array.isArray(l)) {
      const idx = arr => new Map((arr || []).map(x => [x[key], x]));
      const B = idx(b), L = idx(l), res = idx(remote[k]);
      for (const [id, x] of L) if (!B.has(id) || JSON.stringify(B.get(id)) !== JSON.stringify(x)) res.set(id, x);
      for (const id of B.keys()) if (!L.has(id)) res.delete(id);
      out[k] = [...res.values()];
    } else if (JSON.stringify(l) !== JSON.stringify(b)) out[k] = l;
  }
  return out;
}
let saveQ = Promise.resolve();
function saveVault(msg) { const job = saveQ.then(() => saveVaultNow(msg)); saveQ = job.catch(() => {}); return job; }   // zapisy po kolei
async function saveVaultNow(msg) {
  const revert = () => { S.vault = JSON.parse(S.vaultSaved); };
  if (S.readOnly) { revert(); toast('Tryb tylko do odczytu – nic nie zapisano. Dodaj token GitHub w Ustawieniach.', 4500); return false; }
  S.vault.updated = new Date().toISOString();
  for (let attempt = 0; ; attempt++) {
    try {
      const blob = await encryptBlob(S.vault, S.pw, S.vaultSalt);
      const r = await GH.putFile('docs/vault.enc', JSON.stringify(blob), S.vaultSha, msg || 'skarbiec: zmiana');
      S.vaultSha = r.content.sha; S.vaultSaved = JSON.stringify(S.vault);
      toast(attempt ? 'Zapisano ✓ (połączone ze zmianami z innego urządzenia)' : 'Zapisano ✓ Bot uwzględni zmiany przy najbliższym pomiarze.');
      syncTargets(); syncVerify();
      return true;
    } catch (e) {
      if (/ 409| 422/.test(e.message) && attempt < 3) {
        // skarbiec zmienił się gdzie indziej – pobierz nowszą wersję, scal i zapisz jeszcze raz
        try {
          const f = await GH.getFile('docs/vault.enc');
          const r = await decryptBlob(JSON.parse(f.text), S.pw);
          S.vault = mergeVault(JSON.parse(S.vaultSaved), S.vault, r.obj);
          S.vault.watchlists ||= []; S.vault.portfolio ||= [];
          S.vaultSha = f.sha; S.vaultSalt = r.salt;
          continue;
        } catch (e2) { e = e2; }
      }
      revert();
      toast('Nie zapisano: ' + e.message, 6000);
      return false;
    }
  }
}

// wycena portfela: średnia sprzedaży z Cardmarketu (cennik jest dobowy – bot zapisuje jeden pomiar dziennie); brak średniej → trend
const PF_METRICS = { avg30: ['średnia 30 dni', 4], avg7: ['średnia 7 dni', 3], avg1: ['średnia z 1 dnia', 5], trend: ['trend', 1] };
const pfMetric = () => { const m = { ...DEFAULT_SETTINGS, ...(S.vault?.settings || {}) }.pf_metric; return PF_METRICS[m] ? m : 'avg30'; };
function pfAgo(key, days, idx) {
  const h = hist(key); if (!h.length) return null;
  const lim = addDays(h.at(-1)[0], -days); let v = null;
  for (const r of h) if (r[0] <= lim && (r[idx] ?? r[1])) v = r[idx] ?? r[1];
  return v;
}
function holdingsCalc() {
  const fx = fxNow();
  const active = [], sold = [];
  for (const h of S.vault.portfolio || []) {
    const m = itemMeta(h), p = nowPrice(h), mk = pfMetric();
    const unit = p?.[mk] ?? p?.trend ?? null;
    const raw = unit != null ? unit * (h.qty || 1) * fx : null;
    const graded = h.grade?.val > 0;   // slab: ręczna wycena zamiast ceny karty bez gradingu
    const value = graded ? h.grade.val * (h.qty || 1) : raw;
    const row = { h, m, p, unit, raw, graded, fb: !graded && unit != null && p?.[mk] == null && mk !== 'trend', value, cost: +h.cost_pln || 0 };
    row.pl = value != null ? value - row.cost : null; row.plp = pct(value, row.cost);
    row.d7 = graded ? null : pct(unit, pfAgo(keyOf(h), 7, PF_METRICS[mk][1]));
    row.free = h.date ? taxFreeFrom(h.date) : null;
    (h.sold ? sold : active).push(row);

  const value = active.reduce((a, r) => a + (r.value || 0), 0), cost = active.reduce((a, r) => a + r.cost, 0);
  const realized = sold.reduce((a, r) => a + ((+r.h.sold.price_pln || 0) - r.cost), 0);
  return { active, sold, value, cost, realized, unpriced: active.filter(r => r.value == null).length };
}

function enNote(rows) {
  const ens = rows.map(r => r.en).filter(e => e?.min != null);
  if (!ens.length) return `Najtaniej EN/NM: najtańsza oferta po angielsku w stanie NM z wysyłką do Polski. Publiczny cennik Cardmarketu tego nie ma – ceny pobiera rozszerzenie Chrome „Skarbiec – Cardmarket” (przycisk „Uaktualnij ceny EN/NM”).${enScript() ? '' : ' Rozszerzenie nie jest zainstalowane w tej przeglądarce.'}`;
  const t = ens.map(e => e.t).sort()[0];
  return `Najtaniej EN/NM: oferty po angielsku, NM, od sprzedawców wysyłających do Polski (cena bez wysyłki) · ${ens.length}/${rows.length} kart · sprawdzone ${agoPL(t)} · „Uaktualnij” otwiera na chwilę kartę Cardmarketu (zamyka się sama); przy zwykłej wizycie na Cardmarkecie ceny odświeżają się same, gdy mają ponad 20 godz. · 🔎 = ponad 15% poniżej trendu.`;
}

// ---------- Grading (slaby PSA/CGC/…) ----------
// Cennik Cardmarketu nie ma cen kart ocenionych – wartość slabu wpisuje się ręcznie (h.grade.val, zł za sztukę, h.grade.t = data wyceny);
// po GRADE_REMIND_D dniach Skarbiec i bot (Discord) przypominają o aktualizacji. Pozostałe pola: by (firma), g (ocena), cert (nr certyfikatu).
const GRADERS = ['PSA', 'CGC', 'BGS', 'SGC', 'TAG', 'ACE'], GRADE_REMIND_D = 30;
const gradeLbl = h => h.grade?.by ? `${h.grade.by} ${h.grade.g || ''}`.trim() : '';
const gradeAge = h => h.grade?.t ? Math.floor((Date.parse(todayISO()) - Date.parse(h.grade.t)) / 864e5) : null;
const gradeDue = h => !!h.grade?.by && !h.sold && (!(h.grade.val > 0) || gradeAge(h) >= GRADE_REMIND_D);
function gradeSoldUrl(h) {   // zakończone aukcje eBay: nazwa + numer + firma i ocena (+ Japanese)
  const c = S.cmnums?.[h.id], no = c?.[1] || String(h.no || '').split('/')[0];
  const q = [baseName(itemMeta(h).name), no, gradeLbl(h), h.lang === 'ja' ? 'japanese' : ''].filter(Boolean).join(' ');
  return `https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(q)}&LH_Sold=1&LH_Complete=1`;
}
function gradeCertUrl(h) {
  const n = String(h.grade?.cert || '').replace(/\D/g, ''); if (!n) return null;
  return h.grade.by === 'PSA' ? `https://www.psacard.com/cert/${n}` : h.grade.by === 'CGC' ? `https://www.cgccards.com/certlookup/${n}/` : null;
}
function formGradeValue(h) {

  modal(`Wycena slabu ${esc(gradeLbl(h))}`, `<p style="margin-top:0"><b>${esc(m.name)}</b> · ${esc(m.set || '')}${h.grade.val > 0 ? `<br><span class="muted">ostatnia wycena: ${P(h.grade.val)} / szt. (${dPL(h.grade.t)})</span>` : ''}</p>
    <p class="muted" style="font-size:13px">Sprawdź ostatnie sprzedaże tej karty w tej ocenie i wpisz realną cenę (najlepiej medianę kilku ostatnich, nie najwyższą ofertę).<br>
    <a href="${esc(gradeSoldUrl(h))}" target="_blank" rel="noopener">Sprzedane na eBay ↗</a>${cert ? ` · <a href="${esc(cert)}" target="_blank" rel="noopener">Certyfikat ${esc(h.grade.by)} ↗</a>` : ''}</p>
    <div class="grid g2" style="gap:10px"><label class="f">Wartość jednej sztuki<input type="number" id="g-v" step="0.01" min="0" value="${h.grade.val > 0 ? h.grade.val : ''}"></label>
      <label class="f">Waluta<select id="g-cur"><option value="PLN">PLN</option><option value="EUR">EUR (kurs ${fxNow().toFixed(4).replace('.', ',')})</option></select></label></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="g-ok">Zapisz wycenę</button><button class="btn" data-close>Anuluj</button></div>`, d => {
    $('#g-ok', d).onclick = async () => {

      if ($('#g-cur', d).value === 'EUR') v = +(v * fxNow()).toFixed(2);
      h.grade = { ...h.grade, val: v, t: todayISO() };

    };

}

// ---------- Sprzątanie zdjęć ----------
// Zdjęcia (foto/…) i wycinki (crop/…) są potrzebne tylko, dopóki wskazuje na nie jakaś pozycja portfela. Zdjęcia z kolejki skanera
// (jeszcze nie zatwierdzone) zostają. Zdjęcia kart z Cardmarketu (img/<id>.jpg) to wspólna pamięć podręczna – nie ruszamy ich.
// Uwaga: usunięte pliki zostają w historii git repozytorium (repo jest prywatne).
const plZdj = n => n === 1 ? 'zdjęcie' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'zdjęcia' : 'zdjęć';
function photoRefs() {
  const used = new Set();
  for (const h of S.vault.portfolio || []) { (h.photos || []).forEach(p => used.add(p)); if (h.crop) used.add(h.crop); }
  for (const j of SC.jobs) { if (j.photo) used.add(j.photo); j.cards.forEach(c => c.cropPath && used.add(c.cropPath)); }
  return used;
}
async function dropPhotos(paths, why) {   // usuń pliki, na które nic już nie wskazuje, i ich wpisy w galerii
  if (S.readOnly || !GH.token || !PHOTOS.repo) return 0;
  const used = photoRefs(), del = [...new Set(paths)].filter(p => p && !used.has(p));
  if (!del.length) return 0;
  const n = await PHOTOS.removeMany(del, `${why}: usunięto ${del.length} zdjęć`);
  const gone = new Set(del), before = (S.vault.scans || []).length;
  S.vault.scans = (S.vault.scans || []).filter(x => !gone.has(x.path));
  if (S.vault.scans.length !== before) await saveVault('galeria: usunięte zdjęcia');
  return n;
}

// ---------- Portfel ----------
// pozycje pogrupowane po dodatkach (jak w segregatorze): w grupie po numerze karty, grupy zwijane (localStorage)
const plKart = n => n === 1 ? 'karta' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'karty' : 'kart';
// bulk: karty tańsze niż track_min_eur (bot nie trzyma ich historii) – w portfelu jedna zwinięta grupa
const bulkMin = () => +({ ...DEFAULT_SETTINGS, ...(S.vault?.settings || {}) }).track_min_eur || 0;
const isBulk = r => bulkMin() > 0 && !r.graded && r.p?.trend != null && r.p.trend < bulkMin();
const pfSort = () => ls.get('skarbiec_pf_sort') || 'name';
const pfClosed = () => { try { return new Set(JSON.parse(ls.get('skarbiec_pf_closed') || '[]')); } catch { return new Set(); } };
const cardNoKey = r => (S.cmnums?.[r.h.id]?.[1] || String(r.h.no || '').split('/')[0] || '').toUpperCase();   // „030”, „TG23”
function pfGroups(rows) {
  const closed = pfClosed(), map = new Map();
  const BULK = `Bulk – karty poniżej ${String(bulkMin()).replace('.', ',')} €`;
  for (const r of rows) {
    const set = isBulk(r) ? BULK : r.m.set || KIND[r.m.kind] || 'Bez dodatku';
    if (!map.has(set)) map.set(set, { set, bulk: set === BULK, rows: [], value: 0, cost: 0, n: 0, last: '' });
    const g = map.get(set);
    g.rows.push(r); g.value += r.value || 0; g.cost += r.cost; g.n += r.h.qty || 1;
    if ((r.h.date || '') > g.last) g.last = r.h.date || '';
  }
  const coll = new Intl.Collator('pl', { numeric: true, sensitivity: 'base' });
  const gs = [...map.values()];
  for (const g of gs) {
    g.open = g.bulk ? closed.has('+bulk') : !closed.has(g.set);   // bulk domyślnie zwinięty
    g.lang = g.rows.every(r => r.h.lang === 'ja') ? 'JP' : '';
    g.rows.sort((a, b) => coll.compare(cardNoKey(a), cardNoKey(b)) || coll.compare(a.m.name, b.m.name));
  }
  const s = pfSort();
  return gs.sort((a, b) => s === 'value' ? b.value - a.value : s === 'date' ? b.last.localeCompare(a.last) || coll.compare(a.set, b.set)
    : a.bulk - b.bulk || (a.set === 'Bez dodatku') - (b.set === 'Bez dodatku') || coll.compare(a.set, b.set));
}

const cmA = (id, name, holo) => { const u = cmLink(id, name, holo); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener" title="Otwórz na Cardmarket" onclick="event.stopPropagation()">↗</a>` : ''; };
const scPrice = (card, holo) => { const r = catRow(card?.idp); return r ? (holo ? r[9] || r[4] : r[4]) : null; };

async function scanJob(j) {
  j.status = 'analiza'; scQueue();
  try {
    const api = await scaleImage(j.file, 1568, 'image/jpeg', 0.85);
    const client = await aiClient();
    const msg = await client.messages.create({
      model: AI_MODEL, max_tokens: 4096, thinking: { type: 'disabled' }, system: SCAN_SYSTEM,
      output_config: { format: { type: 'json_schema', schema: SCAN_SCHEMA } },
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64e(new Uint8Array(await api.arrayBuffer())) } },
        { type: 'text', text: 'Rozpoznaj karty na tym zdjęciu.' }] }],
    });
    const cost = (msg.usage.input_tokens * AI_PRICE.in + msg.usage.output_tokens * AI_PRICE.out) / 1e6;
    SC.cost += cost; j.cost = cost;
    if (msg.stop_reason === 'refusal') throw new Error('Model odmówił analizy tego zdjęcia.');
    if (msg.stop_reason === 'max_tokens') throw new Error('Za dużo kart na jednym zdjęciu – podziel je na mniejsze.');
    const out = JSON.parse(msg.content.find(b => b.type === 'text')?.text || '{"cards":[]}');
    j.status = 'dopasowanie'; scQueue();
    try { await loadCatalog(); } catch {}
    j.cards = await Promise.all((out.cards || []).map(async det => {
      const [cands, crop] = await Promise.all([resolveCard(det), cropCard(j.file, det.box).catch(() => null)]);
      // Reverse Holo tylko, gdy Cardmarket ma dla tej karty osobną cenę RH (np. karty LEGEND/ex są holo, ale nie „reverse”)
      return { det, cands, crop, cropUrl: crop && URL.createObjectURL(crop), sel: cands.length ? 0 : -1, holo: det.variant === 'reverse_holo' && !!catRow(cands[0]?.idp)?.[9], qty: 1, cost: '', on: !!cands[0]?.idp && det.confidence === 'high' && (cands.length === 1 || !!cands[0].exact || !!cands[0].verify) };
    }));
    j.status = 'gotowe';
    // tryb ciągły: zdjęcie bez karty (np. pusta taca po zmianie światła) → to jest tło; kolejnego takiego zdjęcia nie wyślemy
    if (j.live && !j.cards.length && j.file.liveSample && LIVE.stream) { LIVE.base = j.file.liveSample; LIVE.last = j.file.liveSample; }
    liveDupScan();
  } catch (e) { j.status = 'błąd'; j.err = aiError(e); }
  scQueue();
  // tryb ciągły (1 karta = 1 zdjęcie): przy bulku zapisujemy tylko wycinek (~60 KB) zamiast pełnego zdjęcia (~400 KB) – inaczej
  // tysiące commonów zapchałyby repo zdjęć; pełne zdjęcie zawsze można dopisać przyciskiem „Zapisz zdjęcie”
  if (j.status === 'gotowe' && j.live && j.cards.length && j.cards.every(c => c.crop && (scPrice(c.cands[c.sel], c.holo) ?? 0) < bulkMin())) { j.cropOnly = true; scQueue(); }
  else if (j.status === 'gotowe') savePhoto(j);
}
// Tryb ciągły: ta sama karta na dwóch kolejnych zdjęciach w ciągu 30 s to prawie na pewno podwójne zdjęcie –
// późniejsze odznaczamy i oznaczamy „możliwy duplikat” (nie usuwamy – może to druga sztuka). Zdjęcia analizują się
// równolegle, więc sprawdzamy całą kolejkę po każdym zakończeniu.
function liveDupScan() {
  const sig = jb => jb.cards.map(c => c.cands[c.sel]?.idp || `${c.det.name}|${c.det.number}`).join(',');
  const live = SC.jobs.filter(x => x.live && x.status === 'gotowe' && x.cards.length).sort((a, b) => a.t - b.t);
  for (let i = 1; i < live.length; i++) {
    const a = live[i - 1], b = live[i];
    if (!b.dup && b.t - a.t < 30e3 && sig(a) === sig(b)) { b.dup = true; b.cards.forEach(c => { c.on = false; }); }   // raz – potem decyduje użytkownik
  }
}
async function savePhoto(j) {   // każde zrobione zdjęcie trafia do prywatnego repo, niezależnie od tego, co z niego dodasz
  if (S.readOnly || !GH.token || j.photo) return;
  try {
    let blob = await scaleImage(j.file, 2000, 'image/webp', 0.82);
    if (blob.type !== 'image/webp') blob = await scaleImage(j.file, 2000, 'image/jpeg', 0.85);   // Safari bez WebP
    const d = todayISO(), path = `foto/${d.slice(0, 4)}/${d.slice(5, 7)}/${d}-${uid()}.${blob.type === 'image/webp' ? 'webp' : 'jpg'}`;
    await PHOTOS.put(path, blob, `foto: ${j.cards.length} kart`);
    j.photo = path; j.photoErr = null;
    PHOTOS.urls.set(path, Promise.resolve(j.url));
  } catch (e) { j.photoErr = /^GitHub 40[34]\b/.test(e.message) ? `Brak dostępu do ${PHOTOS.repo} – dodaj to repozytorium do tokenu GitHub.` : e.message; }
  scQueue();
}
function scPump() {
  for (const j of SC.jobs) { if (SC.busy >= 2) break; if (j.status === 'czeka') { SC.busy++; scanJob(j).finally(() => { SC.busy--; scPump(); }); } }
}
function scAdd(files) {
  for (const f of files) if (/^image\//.test(f.type) || /\.(heic|jpe?g|png|webp)$/i.test(f.name))
    SC.jobs.push({ id: uid(), file: f, url: URL.createObjectURL(f), status: 'czeka', cards: [], t: Date.now(), live: f.name.startsWith('stojak-') });
  scQueue(); scPump();
}
const scSelected = () => SC.jobs.flatMap(j => j.cards.filter(c => c.on && c.cands[c.sel]).map(c => ({ j, c, card: c.cands[c.sel] })));

// ---------- tryb ciągły (telefon w stojaku nad kartą) ----------
// Kamera działa cały czas. Co 200 ms mały podgląd (48×36, kolor) porównujemy z poprzednim:
// ruch (ręka, kładziona karta) → czekamy; obraz stoi ≥ 0,7 s i różni się od ostatnio zeskanowanego oraz od pustego tła
// → zdjęcie w pełnej rozdzielczości trafia do kolejki skanera (to samo rozpoznawanie co przy zwykłych zdjęciach).
const LIVE = { stream: null, video: null, timer: null, prev: null, base: null, last: null, still: 0, n: 0, wake: null, state: '', sens: +(ls.get('skarbiec_live_sens') || 8) };
const LIVE_W = 48, LIVE_H = 36, LIVE_STABLE_MS = 700;
function liveSample() {
  const v = LIVE.video; if (!v || v.readyState < 2) return null;
  const c = liveSample.c ||= Object.assign(document.createElement('canvas'), { width: LIVE_W, height: LIVE_H });
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(v, 0, 0, LIVE_W, LIVE_H);
  // kolor, nie skala szarości – żółta karta na jasnej tacy w szarości wygląda jak puste tło
  const d = g.getImageData(0, 0, LIVE_W, LIVE_H).data, out = new Uint8Array(LIVE_W * LIVE_H * 3);
  for (let i = 0, j = 0; i < d.length; i += 4) { out[j++] = d[i]; out[j++] = d[i + 1]; out[j++] = d[i + 2]; }
  return out;
}
const liveDiff = (a, b) => { if (!a || !b) return 255; let s = 0; for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; };
function liveSet(state, txt) {
  LIVE.state = state; LIVE.text = txt;
  const el = $('#lv-state'); if (el) el.innerHTML = txt;
  const f = $('#lv-frame'); if (f) f.style.outlineColor = { move: 'var(--s4)', wait: 'var(--axis)', shot: 'var(--s3)' }[state] || 'var(--axis)';
}
function liveBeep() {
  try { const a = liveBeep.ctx ||= new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.value = 0.08; o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 0.09); } catch {}
  navigator.vibrate?.(60);
}
async function liveShot(manual) {
  const v = LIVE.video; if (!v?.videoWidth) return;
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  if (!blob) return;
  LIVE.n++;
  const f = new File([blob], `stojak-${Date.now()}.jpg`, { type: 'image/jpeg' });
  f.liveSample = LIVE.last;   // jeśli okaże się, że na zdjęciu nie ma karty – ten widok zostanie nowym „pustym tłem”
  scAdd([f]);
  liveBeep();
  const n = $('#lv-n'); if (n) n.textContent = LIVE.n;
  liveSet('shot', `✓ Zeskanowano kartę nr ${LIVE.n}${manual ? ' (ręcznie)' : ''} – połóż następną`);
}
function liveTick() {
  const s = liveSample(); if (!s) return;
  const now = Date.now(), motion = liveDiff(s, LIVE.prev);
  LIVE.prev = s;
  if (motion > LIVE.sens / 2) {
    LIVE.still = now;
    // ręka zasłoniła kartę (obraz wyraźnie inny niż przy ostatnim zdjęciu) → następna nieruchoma karta to nowe zdjęcie,
    // także gdy to druga taka sama karta położona na pierwszej
    if (LIVE.last && liveDiff(s, LIVE.last) >= LIVE.sens) LIVE.armed = true;
    liveSet('move', 'Ruch… czekam, aż karta się uspokoi'); return;
  }
  if (now - LIVE.still < LIVE_STABLE_MS) return;
  if (!LIVE.base) { LIVE.base = s; LIVE.last = s; LIVE.armed = false; liveSet('wait', 'Tło zapamiętane – połóż kartę'); return; }
  const fromBase = liveDiff(s, LIVE.base), fromLast = liveDiff(s, LIVE.last);
  if (fromBase < LIVE.sens) { LIVE.last = s; LIVE.armed = false; if (LIVE.state !== 'wait') liveSet('wait', 'Pusto – połóż kartę'); return; }   // karta zdjęta
  if (fromLast >= LIVE.sens || LIVE.armed) { LIVE.last = s; LIVE.armed = false; liveShot(); }
}
async function liveStart() {
  if (!navigator.mediaDevices?.getUserMedia) return toast('Ta przeglądarka nie daje dostępu do kamery.', 5000);
  try {
    LIVE.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) { LIVE.stream = null; return toast('Brak dostępu do kamery: ' + e.message, 6000); }
  LIVE.video ||= Object.assign(document.createElement('video'), { muted: true, playsInline: true, autoplay: true });
  LIVE.video.setAttribute('playsinline', '');
  LIVE.video.srcObject = LIVE.stream;
  await LIVE.video.play().catch(() => {});
  Object.assign(LIVE, { prev: null, base: null, last: null, still: Date.now(), n: 0, armed: false, state: '', text: '' });
  try { LIVE.wake = await navigator.wakeLock?.request('screen'); } catch {}   // ekran telefonu nie zgaśnie
  LIVE.timer = setInterval(liveTick, 200);
  render();
}
function liveStop() {
  clearInterval(LIVE.timer); LIVE.timer = null;
  LIVE.stream?.getTracks().forEach(t => t.stop()); LIVE.stream = null;
  LIVE.wake?.release?.().catch(() => {}); LIVE.wake = null;
  if (S.tab === 'skaner') render();
}
function liveMount() {
  const box = $('#sc-live'); if (!box || !LIVE.stream) return;
  box.innerHTML = `<div style="margin-top:12px;display:grid;gap:8px">
    <div id="lv-frame" style="outline:3px solid var(--axis);border-radius:10px;overflow:hidden;background:#000;max-width:520px"></div>
    <div id="lv-state" style="font-weight:600">${esc(LIVE.state ? '' : 'Uruchamiam kamerę…')}</div>
    <div class="row" style="font-size:13px">
      <button class="btn sm" data-act="liveShot">📸 Zeskanuj teraz</button>
      <button class="btn sm" data-act="liveBase">Ustaw puste tło</button>
      <label class="row muted">czułość <input type="range" id="lv-sens" min="4" max="20" value="${LIVE.sens}" style="width:110px" title="niżej = łapie słabszy kontrast, wyżej = mniej fałszywych zdjęć"></label>
      <span class="muted">zeskanowane: <b id="lv-n">${LIVE.n}</b></span>
    </div>
    <p class="muted" style="font-size:12px;margin:0">Połóż telefon na stojaku aparatem w dół, włącz tryb przy pustej tacy. Kładź karty jedna po drugiej – każda nowa, nieruchoma karta to jedno zdjęcie (ok. 0,04 ¢). Zdejmowanie karty niczego nie skanuje. Ekran nie zgaśnie, dopóki tryb działa.</p>
  </div>`;
  LIVE.video.style.cssText = 'width:100%;display:block';
  $('#lv-frame', box).appendChild(LIVE.video);
  $('#lv-sens', box).addEventListener('input', e => { LIVE.sens = +e.target.value; ls.set('skarbiec_live_sens', LIVE.sens); });
  liveSet(LIVE.state || 'wait', LIVE.text || 'Patrzę na tło – nie ruszaj tacy');
}

async function scApprove() {
  const sel = scSelected(); if (!sel.length) return;
  for (const j of new Set(sel.map(x => x.j))) if (!j.photo && !j.cropOnly) await savePhoto(j);
  // karty bez obrazka z TCGdex: zapisz wycinek z twojego zdjęcia (podgląd w portfelu, dopóki nie ma zdjęcia z Cardmarketu)
  for (const { j, c, card } of sel) if ((!card.img || j.cropOnly) && c.crop && !c.cropPath && !S.readOnly) {
    const path = `crop/${todayISO().slice(0, 7)}/${uid()}.jpg`;
    try { await PHOTOS.put(path, c.crop, `wycinek: ${card.name}`); c.cropPath = path; PHOTOS.urls.set(path, Promise.resolve(c.cropUrl)); } catch (e) { console.warn('wycinek:', e.message); }
  }

    const r = catRow(card.idp);
    return { uid: uid(), id: card.idp, holo: !!c.holo, name: r ? r[1] : card.name, set: (r && S.catalog.exp[r[3]]) || card.set, kind: 'S',
      qty: c.qty, date: SC.date, cost_pln: +(+c.cost || 0).toFixed(2), note: '', no: printedNo(c.det) || [card.no, card.total].filter(Boolean).join('/'), lang: card.lang || c.det.language, sold: null, tcgdex: card.tid,
      ...(card.verify ? { verify: { name_en: c.det.name_en, number: c.det.number, set_code: c.det.set_code, cands: card.alts } } : {}), ...(card.img ? { img: card.img } : {}), ...(c.cropPath ? { crop: c.cropPath } : {}), ...(c.det.slab_company ? { grade: { by: (GRADERS.find(g => g === String(c.det.slab_company).toUpperCase()) || c.det.slab_company), g: String(c.det.slab_grade || '').replace(/^\D+/, ''), cert: c.det.slab_cert || '' } } : {}), ...(j.photo ? { photos: [j.photo] } : {}) };
  });
  const scans = new Map();
  for (const { j } of sel) if (j.photo) scans.set(j.photo, { path: j.photo, date: todayISO(), n: j.cards.length });
  S.vault.portfolio = [...(S.vault.portfolio || []), ...recs];
  S.vault.scans = [...(S.vault.scans || []).filter(s => !scans.has(s.path)), ...scans.values()].slice(-500);
  if (await saveVault(`skaner: +${recs.length} kart`)) {
    sel.forEach(({ c }) => { c.on = false; c.added = true; });
    SC.jobs = SC.jobs.filter(j => j.cards.some(c => !c.added && c.cands.length) || j.status !== 'gotowe');
    toast(`Dodano ${recs.length} kart do portfela ✓`);
    // karty JP/promo do weryfikacji albo bez zdjęcia z Cardmarketu: na telefonie zleć komputerowi, na komputerze uruchom od razu
    if (recs.some(r => r.verify || !r.img)) { if (enScript()) ACT.enRefresh(); else requestDesktop('en'); }
  }
  render();
}

function modal(title, body, onMount) {

function mountPicker(d, onPick) {
  let kind = 'all';

    if (numTok && nameQ) {
      const my = ++runId, [no, set = ''] = numTok.split('/');

      resolveIn('en', pseudo, true).then(tcg => {

        const seen = new Set(), exact = [...byCm, ...tcg.filter(x => x.idp).map(x => ({ ...x, lang: 'en' }))].filter(x => !seen.has(x.idp) && seen.add(x.idp));

function formHolding(base, existing) {
  const it = existing || base, m = itemMeta(it), p = nowPrice(it);
  const curCost = existing ? existing.cost_pln : '';
  modal(existing ? 'Edytuj pozycję' : 'Dodaj do portfela', `<p style="margin-top:0"><b>${esc(m.name)}</b><br><span class="muted">${esc(m.set)} · trend ${E(p?.trend)} (≈ ${P(p?.trend * fxNow())})</span></p>
    <div class="grid g2" style="gap:10px">
      <label class="f">Ilość<input type="number" id="h-q" value="${existing?.qty || 1}" min="1"></label>
      <label class="f">Data zakupu<input type="date" id="h-d" value="${existing?.date || todayISO()}" max="${todayISO()}"></label>
      <label class="f">Łączny koszt zakupu (z wysyłką)<input type="number" id="h-c" step="0.01" min="0" value="${curCost}"></label>
      <label class="f">Waluta<select id="h-cur"><option value="PLN">PLN</option><option value="EUR">EUR (przeliczę po kursie ${fxNow().toFixed(4).replace('.', ',')})</option></select></label>
      <label class="f" style="grid-column:1/-1">Notatka (np. gdzie kupione, stan)<input type="text" id="h-n" value="${esc(existing?.note || '')}"></label>
      <label class="f">Grading<select id="h-gby"><option value="">brak – karta bez oceny</option>${[...new Set([...GRADERS, existing?.grade?.by].filter(Boolean))].map(g => `<option ${existing?.grade?.by === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></label>
      <label class="f">Ocena<input type="text" id="h-gg" value="${esc(existing?.grade?.g || '')}" placeholder="np. 10, 9.5"></label>
      <label class="f">Nr certyfikatu<input type="text" id="h-gc" value="${esc(existing?.grade?.cert || '')}" inputmode="numeric"></label>
      <label class="f">Wartość slabu / szt. (zł)<input type="number" id="h-gv" step="0.01" min="0" value="${existing?.grade?.val > 0 ? existing.grade.val : ''}" placeholder="ręczna wycena"></label>
    </div>
    ${existing?.sold ? `<div class="banner" style="margin-top:10px">Sprzedane ${dPL(existing.sold.date)} za ${P(existing.sold.price_pln)}. <button class="btn sm" id="h-unsell">Cofnij sprzedaż</button></div>` : ''}
    <div class="spread" style="margin-top:14px"><div class="row"><button class="btn primary" id="h-ok">${existing ? 'Zapisz' : 'Dodaj'}</button><button class="btn" data-close>Anuluj</button></div>${existing ? '<button class="btn danger" id="h-del">Usuń</button>' : ''}</div>`, d => {
    $('#h-ok', d).onclick = async () => {
      let cost = parseFloat($('#h-c', d).value); if (!(cost >= 0)) return toast('Podaj koszt zakupu.');
      if ($('#h-cur', d).value === 'EUR') cost = +(cost * fxNow()).toFixed(2);
      const rec = existing || { uid: uid(), id: it.id, holo: !!it.holo, ...snapshotMeta(it), sold: null };
      Object.assign(rec, { qty: Math.max(1, +$('#h-q', d).value || 1), date: $('#h-d', d).value || null, cost_pln: cost, note: $('#h-n', d).value.trim() });
      const gby = $('#h-gby', d).value, gv = parseFloat($('#h-gv', d).value);
      if (gby) {
        const g = { ...(rec.grade || {}), by: gby, g: $('#h-gg', d).value.trim(), cert: $('#h-gc', d).value.trim() };
        if (gv > 0 && gv !== rec.grade?.val) Object.assign(g, { val: gv, t: todayISO() }); else if (!(gv > 0)) { delete g.val; delete g.t; }
        rec.grade = g;
      } else delete rec.grade;
      if (!existing) S.vault.portfolio = [...(S.vault.portfolio || []), rec];
      d.close(); await saveVault(`portfel: ${existing ? 'zmiana' : '+'} ${m.name}`); render();
    };
    if (existing) {
      $('#h-del', d).onclick = async () => {
        if (!confirm('Usunąć tę pozycję z portfela? Jej zdjęcia (jeśli nie ma na nich innych kart z portfela) też zostaną usunięte.')) return;
        S.vault.portfolio = S.vault.portfolio.filter(x => x.uid !== existing.uid); d.close();
        if (await saveVault('portfel: usunięto')) {
          try { const n = await dropPhotos([...(existing.photos || []), existing.crop], 'usunięta pozycja portfela'); if (n) toast(`Usunięto też ${n} ${plZdj(n)} tej karty.`); }
          catch (e) { toast('Pozycja usunięta, ale zdjęć nie udało się usunąć: ' + e.message, 5000); }
        }
        render();
      };
      const un = $('#h-unsell', d); if (un) un.onclick = async () => { existing.sold = null; d.close(); await saveVault('portfel: cofnięto sprzedaż'); render(); };
    }
  });
}

function formImport() {
  modal('Import z Tampermonkey', `<p style="margin-top:0">Otwórz Wants Listę na Cardmarket z końcówką <code>#track</code>, kliknij <b>🤖 Konfiguracja dla bota</b> i wklej tutaj. Możesz wkleić też kilka list naraz (w nawiasach [ ]).</p>
    <textarea id="im-t" rows="8" style="width:100%;font-family:ui-monospace,monospace;font-size:12px" placeholder='{"name": "...", "products": [123, 456], "target": 1500}'></textarea>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="im-ok">Importuj</button><button class="btn" data-close>Anuluj</button></div>`, d => {
    $('#im-ok', d).onclick = async () => {
      let data; try { data = JSON.parse($('#im-t', d).value); } catch { return toast('To nie jest poprawny JSON.'); }
      try { await loadCatalog(); } catch {}
      const lists = Array.isArray(data) ? data : data.watches || [data];
      let n = 0;
      for (const w of lists) {
        if (!w || !Array.isArray(w.products)) continue;
        const items = w.products.map(p => typeof p === 'object' ? { id: +p.id, holo: !!p.holo, name: p.name, url: p.url } : { id: +p, holo: false })
          .map(it => { const m = snapshotMeta(it); return { ...it, ...m, name: m.name || it.name || undefined, ...(it.url ? { url: it.url } : {}), qty: 1 }; });
        const ex = (S.vault.watchlists || []).find(x => x.name === w.name);
        if (ex) { if (!confirm(`Lista „${w.name}” już istnieje. Zastąpić jej pozycje?`)) continue; ex.items = items; if (w.target) ex.target_eur = +w.target; S.wl = ex.id; }
        else { const rec = { id: uid(), name: w.name || 'Lista z Cardmarket', items, target_eur: w.target ? +w.target : null, metric: 'trend' }; S.vault.watchlists = [...(S.vault.watchlists || []), rec]; S.wl = rec.id; }
        n++;
      }
      if (!n) return toast('Nie znalazłem list do zaimportowania.');
      d.close(); S.tab = 'watch'; await saveVault(`import ${n} list z Tampermonkey`); render();
    };
  });
}

  photo: a => openPhotos([a.dataset.path]),
  photoclean: async () => {
    const out = $('#s-pcres'); out.innerHTML = '<span class="spin"></span>';
    try {
      const used = photoRefs(), files = (await PHOTOS.list(['foto/', 'crop/'])).filter(f => !used.has(f.path));
      if (!files.length) { out.textContent = 'Nie ma nieużywanych zdjęć.'; return; }
      const mb = (files.reduce((a, f) => a + f.size, 0) / 1048576).toFixed(1).replace('.', ',');
      if (!confirm(`Usunąć ${files.length} ${plZdj(files.length)} (${mb} MB), na które nie wskazuje żadna karta w portfelu?\n\nZdjęcia z kolejki skanera i zdjęcia kart z Cardmarketu zostają.`)) { out.textContent = ''; return; }
      const n = await dropPhotos(files.map(f => f.path), 'sprzątanie zdjęć');
      out.innerHTML = `<span class="up">✓ usunięto ${n} ${plZdj(n)}</span>`;
    } catch (e) { out.innerHTML = `<span class="down">${esc(e.message)}</span>`; }
  },
  sellcm: a => { const h = S.vault.portfolio.find(x => x.uid === a.dataset.uid); if (h) formSellCM(h); },
  gradeval: a => { const h = S.vault.portfolio.find(x => x.uid === a.dataset.uid); if (h?.grade) formGradeValue(h); },
  pfgrp: a => { const c = pfClosed(), k = a.dataset.set; c.has(k) ? c.delete(k) : c.add(k); ls.set('skarbiec_pf_closed', JSON.stringify([...c])); render(); },
  holdphotos: a => { const h = S.vault.portfolio.find(x => x.uid === a.dataset.uid); if (h?.photos?.length) openPhotos(h.photos, itemMeta(h).name); },
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || !ACT[a.dataset.act]) return;
  if (a.tagName === 'A') e.preventDefault();
  ACT[a.dataset.act](a, e);
});

// ============================================================
//   START: logowanie / zakładanie skarbca
// ============================================================
function loginScreen(err, setup) {
  $('#app').innerHTML = `<div class="login"><form class="card stack" id="lf">
    <div class="logo" style="font-size:20px"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><rect x="9" y="6" width="14" height="20" rx="2" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M12 19l3-3 2 2 3-4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Skarbiec</div>
    ${setup ? `<p style="margin:0">Pierwsze uruchomienie: załóż skarbiec. Hasło szyfruje twoje dane – <b>bez niego nie da się ich odczytać</b>, więc go nie zgub.</p>
      <label class="f">Repozytorium<input type="text" id="l-repo" value="${esc(GH.repo)}" placeholder="login/skarbiec" required></label>
      <label class="f">Token GitHub<input type="password" id="l-token" value="${esc(GH.token)}" placeholder="github_pat_…" required autocomplete="off"></label>
      <label class="f">Nowe hasło (min. 10 znaków)<input type="password" id="l-pw" minlength="10" required autocomplete="new-password"></label>
      <label class="f">Powtórz hasło<input type="password" id="l-pw2" minlength="10" required autocomplete="new-password"></label>`
    : `<label class="f">Hasło<input type="password" id="l-pw" required autocomplete="current-password" autofocus></label>
      <label class="row" style="font-size:13px;color:var(--ink-2)"><input type="checkbox" id="l-rem"> Zapamiętaj na tym urządzeniu (nie na cudzym komputerze)</label>`}
    ${err ? `<div class="down" role="alert">${esc(err)}</div>` : ''}
    <button class="btn primary" type="submit">${setup ? 'Załóż skarbiec' : 'Zaloguj'}</button>
    <p class="muted" style="font-size:12px;margin:0">Dane są szyfrowane w przeglądarce (AES-256). Hasło nie jest nigdzie wysyłane.</p>
  </form></div>`;
  $('#lf').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('button[type=submit]', e.target); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Chwila…';
    try {
      if (setup) {
        const pw = $('#l-pw').value; if (pw !== $('#l-pw2').value) throw new Error('Hasła się różnią.');
        ls.set('skarbiec_repo', $('#l-repo').value.trim()); ls.set('skarbiec_token', $('#l-token').value.trim());
        if (await GH.getFile('docs/vault.enc')) throw new Error('Skarbiec już istnieje w tym repozytorium – odśwież stronę i zaloguj się.');
        const vault = { v: 1, settings: { ...DEFAULT_SETTINGS }, watchlists: [], portfolio: [], created: new Date().toISOString() };
        const blob = await encryptBlob(vault, pw);
        await GH.putFile('docs/vault.enc', JSON.stringify(blob), null, 'skarbiec: założono');
        $('#app').innerHTML = `<div class="login"><div class="card stack"><h2>✓ Skarbiec założony</h2>
          <p style="margin:0">Ostatni krok na GitHubie: <b>Settings → Secrets and variables → Actions → New repository secret</b></p>
          <p style="margin:0">Nazwa: <code>SKARBIEC_PASSWORD</code>, wartość: <b>to samo hasło</b>. Bez tego bot nie odczyta twoich list.</p>
          <p style="margin:0">Potem odśwież tę stronę i zaloguj się.</p><button class="btn primary" onclick="location.reload()">Odśwież</button></div></div>`;
        return;
      }
      await unlock($('#l-pw').value, $('#l-rem').checked);
    } catch (err) { loginScreen(err.message, setup); }
  });
}

async function unlock(pw, remember) {
  let blob = null;
  S.readOnly = true;
  if (GH.token && GH.repo) {
    try { const f = await GH.getFile('docs/vault.enc'); if (f) { blob = JSON.parse(f.text); S.vaultSha = f.sha; S.readOnly = false; } }
    catch (e) { console.warn('GitHub API:', e.message); }
  }
  if (!blob) blob = await fetchPublic('vault.enc');
  if (!blob) throw new Error('Nie znalazłem skarbca.');
  try { const r = await decryptBlob(blob, pw); S.vault = r.obj; S.vaultSalt = r.salt; }
  catch { ls.set('skarbiec_pw', null); throw new Error('Złe hasło.'); }
  S.vault.watchlists ||= []; S.vault.portfolio ||= [];
  S.vaultSaved = JSON.stringify(S.vault);
  S.pw = pw;
  if (remember) ls.set('skarbiec_pw', pw);
  const [mBlob, meta] = await Promise.all([fetchPublic('market.enc').catch(() => null), fetchPublic('meta.json').catch(() => null)]);
  S.meta = meta;
  S.market = mBlob ? (await decryptBlob(mBlob, pw).catch(() => ({ obj: null }))).obj : null;
  S.market ||= { h: {}, fx: {}, pv: [], alerts: [], state: {} };
  shell();
  loadCatalog().then(() => { if (S.tab !== 'rynek') render(); }).catch(() => {});
  loadEN().then(async () => { await loadCatalog().catch(() => {}); applyVerify(); syncVerify(); if (S.en?.size && ['watch', 'portfel'].includes(S.tab)) render(); });
  enLiveRefresh();
  loadCatalog().catch(() => {}).then(syncTargets);
}

// zakładka w adresie (#watch, #portfel, #watch/<idListy>…): odświeżenie zostawia cię w tym samym miejscu, działa „Wstecz”
function fromHash() {
  const [t, w] = location.hash.slice(1).split('/');
  if (TABS.some(([id]) => id === t)) { S.tab = t; if (w) S.wl = decodeURIComponent(w); }
}
function toHash() {
  const want = '#' + S.tab + (S.tab === 'watch' && S.wl ? '/' + encodeURIComponent(S.wl) : '');
  if (location.hash !== want) history.pushState(null, '', location.pathname + location.search + want);
}
window.addEventListener('popstate', () => { fromHash(); if (S.vault) render(); });

(async function start() {
  fromHash();
  const th = ls.get('skarbiec_theme'); if (th) document.documentElement.dataset.theme = th;
  $('#app').innerHTML = '<div class="login"><span class="spin"></span></div>';
  try {
    const exists = await fetchPublic('vault.enc');
    if (!exists) return loginScreen('', true);
    const saved = ls.get('skarbiec_pw');
    if (saved) { try { await unlock(saved, true); return; } catch {} }
    loginScreen('');
  } catch (e) { loginScreen(e.message); }
})();
</script>
