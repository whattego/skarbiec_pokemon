<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--surface-2:#f3f2ee;--ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;

  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s7:#6250d6;--s8:#e34948;

  --accent:#2a78d6;--accent-ink:#fff;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}

  --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);

  --good-ink:#0ca30c;--accent:#3987e5;--shadow:none;
}}

  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--surface-2:#232321;--ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;

  --good-ink:#0ca30c;--accent:#3987e5;--shadow:none;
}

.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{border:0;padding:0;background:none;cursor:pointer;text-align:left;font-size:11px;color:var(--muted)}

<body>
<div id="app"></div>
<script>
'use strict';
/* ============================================================
   Skarbiec – panel inwestycyjny kart Pokémon
   Dane: publiczny cennik Cardmarketu (bot GitHub Actions) + twój zaszyfrowany skarbiec.
   Wszystko, co prywatne (watchlisty, portfel, historia), jest szyfrowane AES-256-GCM
   kluczem z twojego hasła (PBKDF2, 310 000 iteracji). Hasło nigdy nie opuszcza przeglądarki.
   ============================================================ */
const ITER = 310000;
const DEFAULT_SETTINGS = { drop_alert_pct: 10, card_drop_alert_pct: 25, dip_alert_pct: 20, profit_steps: [50, 100, 200, 400], weekly_summary: true, summary_weekday: 0 };
const KIND = { S: 'Karta', D: 'Display / box', E: 'ETB', B: 'Booster', O: 'Inny sealed' };
const S = { pw: null, vault: null, vaultSha: null, vaultSalt: null, market: null, meta: null, catalog: null, catMap: null, tab: 'pulpit', wl: null, charts: [], readOnly: true, branch: null };

// ---------------- narzędzia ----------------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nfE = new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'EUR' });
const nfP0 = new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN', maximumFractionDigits: 0 });
const nfP2 = new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN' });
const E = v => v == null || isNaN(v) ? '—' : nfE.format(v);
const P = v => v == null || isNaN(v) ? '—' : (Math.abs(v) < 100 ? nfP2 : nfP0).format(v);
const pct = (a, b) => a != null && b ? (a - b) / b * 100 : null;
const PC = (p, plus = true) => p == null || isNaN(p) ? '—' : `${p > 0 && plus ? '+' : p < 0 ? '−' : ''}${Math.abs(p).toFixed(1).replace('.', ',')}%`;
const cls = p => p == null ? '' : p > 0.05 ? 'up' : p < -0.05 ? 'down' : '';
const arrow = p => p == null ? '' : p > 0.05 ? '▲ ' : p < -0.05 ? '▼ ' : '';
const dPL = d => d ? new Date(d + (d.length === 10 ? 'T12:00:00' : '')).toLocaleDateString('pl-PL', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const todayISO = () => new Date().toISOString().slice(0, 10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const keyOf = it => `${+it.id}${it.holo ? 'h' : ''}`;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function taxFreeFrom(iso) { const d = new Date(iso + 'T12:00:00Z'); const m = d.getUTCMonth() + 7; return new Date(Date.UTC(d.getUTCFullYear() + Math.floor(m / 12), m % 12, 1)).toISOString().slice(0, 10); }

// ---------------- kryptografia (zgodna z botem) ----------------
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const keyCache = new Map();
function deriveKey(pw, salt) {
  const id = pw + '|' + b64e(salt);
  if (!keyCache.has(id)) keyCache.set(id, (async () => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  })());
  return keyCache.get(id);
}
const pipe = async (u8, stream) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer());
async function decryptBlob(blob, pw) {
  const salt = b64d(blob.salt);
  const pt = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(blob.iv) }, await deriveKey(pw, salt), b64d(blob.ct)));
  return { obj: JSON.parse(new TextDecoder().decode(await pipe(pt, new DecompressionStream('gzip')))), salt };
}
async function encryptBlob(obj, pw, salt) {
  salt = salt || crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await pipe(new TextEncoder().encode(JSON.stringify(obj)), new CompressionStream('gzip'));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(pw, salt), data));
  return { v: 1, kdf: 'PBKDF2-SHA256', iter: ITER, salt: b64e(salt), iv: b64e(iv), ct: b64e(ct) };
}

// ---------------- GitHub (zapis zmian i uruchamianie bota) ----------------
const GH = {
  get api() { return ls.get('skarbiec_api') || 'https://api.github.com'; },
  get token() { return ls.get('skarbiec_token') || ''; },
  get repo() {
    const o = ls.get('skarbiec_repo'); if (o) return o;
    const m = location.hostname.match(/^([^.]+)\.github\.io$/); const seg = location.pathname.split('/').filter(Boolean)[0];
    return m && seg && !seg.endsWith('.html') ? `${m[1]}/${seg}` : '';
  },
  async call(path, opts = {}, repo = this.repo) {
    if (!repo || !this.token) throw new Error('Brak tokenu GitHub lub nazwy repozytorium (Ustawienia).');
    const r = await fetch(`${this.api}/repos/${repo}${path}`, { ...opts, headers: { Authorization: `Bearer ${this.token}`, Accept: opts.raw ? 'application/vnd.github.raw' : 'application/vnd.github+json', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
    if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch {} throw new Error(`GitHub ${r.status}${m ? ': ' + m : ''}`); }
    return r.status === 204 ? null : opts.raw ? r.blob() : r.json();
  },
  async branch() { if (!S.branch) S.branch = (await this.call('')).default_branch || 'main'; return S.branch; },
  async getFile(path) {
    try { const j = await this.call(`/contents/${path}`); return { text: new TextDecoder().decode(b64d(j.content.replace(/\n/g, ''))), sha: j.sha }; }
    catch (e) { if (/ 404/.test(e.message)) return null; throw e; }
  },
  async putFile(path, text, sha, message) {
    const body = { message, content: b64e(new TextEncoder().encode(text)), branch: await this.branch() };
    if (sha) body.sha = sha;
    return this.call(`/contents/${path}`, { method: 'PUT', body: JSON.stringify(body) });
  },
  async runBot(test) {
    return this.call('/actions/workflows/bot.yml/dispatches', { method: 'POST', body: JSON.stringify({ ref: await this.branch(), ...(test ? { inputs: { test: 'true' } } : {}) }) });
  },
};
// zdjęcia kart: osobne, prywatne repozytorium (ten sam token)
const PHOTOS = {
  get repo() { return ls.get('skarbiec_photo_repo') || (GH.repo ? `${GH.repo.split('/')[0]}/skarbiec-foto` : ''); },
  branch: null,
  async put(path, blob, message) {
    if (!this.branch) this.branch = (await GH.call('', {}, this.repo)).default_branch || 'main';
    const body = { message, content: b64e(new Uint8Array(await blob.arrayBuffer())), branch: this.branch };
    return GH.call(`/contents/${path}`, { method: 'PUT', body: JSON.stringify(body) }, this.repo);
  },
  urls: new Map(),
  url(path) {   // blob: URL do wyświetlenia (repo jest prywatne, więc przez API z tokenem)
    if (!this.urls.has(path)) this.urls.set(path, GH.call(`/contents/${path.split('/').map(encodeURIComponent).join('/')}`, { raw: true }, this.repo).then(b => URL.createObjectURL(b)).catch(e => { this.urls.delete(path); throw e; }));
    return this.urls.get(path);
  },
};
// ceny EN/NM: zapisuje je Tampermonkey (tryb #track, przycisk „🔗 Skarbiec”) w prywatnym repo jako en/<idListy>.json
// publiczny cennik Cardmarketu ma tylko „low” ze wszystkich języków i stanów
async function loadEN() {
  if (!GH.token || !PHOTOS.repo) return;
  try {
    const files = (await GH.call('/contents/en', {}, PHOTOS.repo).catch(e => { if (/ 404/.test(e.message)) return []; throw e; })).filter(f => f.name.endsWith('.json') && f.name !== 'targets.json');
    const docs = await Promise.all(files.map(f => GH.call(`/contents/en/${encodeURIComponent(f.name)}`, { raw: true }, PHOTOS.repo).then(b => b.text()).then(JSON.parse).catch(() => null)));
    const m = new Map();
    for (const d of docs.filter(Boolean)) for (const [k, v] of Object.entries(d.items || {})) {
      const cur = m.get(k);
      if (!cur || cur.t < d.t) m.set(k, { ...v, t: d.t, list: d.name || d.list });
    }
    S.en = m;
  } catch (e) { console.warn('ceny EN/NM:', e.message); }
}
const enOf = it => S.en?.get(keyOf(it)) || null;
// lista kart dla skryptu Tampermonkey „Skarbiec – ceny EN/NM” (watchlisty + nie sprzedany portfel); jawna, ale w prywatnym repo
async function syncTargets() {
  if (S.readOnly || !GH.token || !PHOTOS.repo) return;
  const seen = new Map();
  for (const it of [...(S.vault.watchlists || []).flatMap(w => w.items || []), ...(S.vault.portfolio || []).filter(h => !h.sold)])
    if (+it.id > 0 && !seen.has(keyOf(it))) seen.set(keyOf(it), { id: +it.id, holo: !!it.holo, name: itemMeta(it).name });
  const json = JSON.stringify({ v: 1, items: [...seen.values()] });
  if (json === S._targets) return;
  try {
    let sha; try { sha = (await GH.call('/contents/en/targets.json', {}, PHOTOS.repo)).sha; } catch (e) { if (!/ 404/.test(e.message)) throw e; }
    if (!PHOTOS.branch) PHOTOS.branch = (await GH.call('', {}, PHOTOS.repo)).default_branch || 'main';
    await GH.call('/contents/en/targets.json', { method: 'PUT', body: JSON.stringify({ message: `lista kart do cen EN/NM (${seen.size})`, content: b64e(new TextEncoder().encode(json)), branch: PHOTOS.branch, ...(sha ? { sha } : {}) }) }, PHOTOS.repo);
    S._targets = json;
  } catch (e) { console.warn('lista kart EN/NM:', e.message); }
}
const CM_EN_REFRESH = 'https://www.cardmarket.com/en/Pokemon#skarbiec-en';
const agoPL = iso => { const h = (Date.now() - new Date(iso)) / 36e5; return h < 1 ? 'przed chwilą' : h < 24 ? `${Math.round(h)} godz. temu` : `${Math.round(h / 24)} dni temu`; };
async function fetchPublic(path) {
  const r = await fetch(`${path}?t=${Date.now()}`, { cache: 'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);

// ---------------- dane ----------------
function hist(key) { return S.market?.h?.[key] || []; }
const fxNow = () => S.meta?.fx || (S.market?.fx ? S.market.fx[Object.keys(S.market.fx).sort().pop()] : null) || 4.3;
const dataDay = () => S.meta?.day || S.market?.day || S.catalog?.day || null;
function catRow(id) { return S.catMap?.get(+id) || null; }
function nowPrice(it) {           // [trend, low, avg7, avg30, avg1] – historia bota, a gdy jej jeszcze nie ma: dzisiejszy katalog
  const h = hist(keyOf(it)); if (h.length) return { trend: h.at(-1)[1], low: h.at(-1)[2], avg7: h.at(-1)[3], avg30: h.at(-1)[4], avg1: h.at(-1)[5], src: 'h', day: h.at(-1)[0] };
  const r = catRow(it.id); if (!r) return null;
  return it.holo ? { trend: r[9], low: null, avg7: null, avg30: null, avg1: null, src: 'c' } : { trend: r[4], low: r[5], avg1: r[6], avg7: r[7], avg30: r[8], src: 'c' };
}
function valueAgo(key, days) {
  const h = hist(key); if (!h.length) return null;
  const lim = addDays(h.at(-1)[0], -days); let v = null;
  for (const r of h) if (r[0] <= lim && r[1]) v = r[1];
  return v;
}
function seriesSum(items, idx = 1) {
  if (!items.length) return [];
  const maps = items.map(it => new Map(hist(keyOf(it)).map(r => [r[0], r[idx]])));
  const days = [...new Set(items.flatMap(it => hist(keyOf(it)).map(r => r[0])))].sort();
  const out = [];
  for (const d of days) {
    let t = 0, ok = true;
    items.forEach((it, i) => { const v = maps[i].get(d); if (v == null) ok = false; else t += v * (it.qty || 1); });
    if (ok) out.push([d, t]);
  }
  return out;
}
function itemMeta(it) {
  const r = catRow(it.id);
  const name = it.name || (r ? r[1] : `Produkt #${it.id}`);
  const set = it.set || (r ? S.catalog.exp[r[3]] : '') || '';
  const kind = it.kind || (r ? S.catalog.kinds[r[2]] : '') || '';
  return { name: name + (it.holo ? ' (Reverse Holo)' : ''), set, kind };
}
async function loadCatalog() {
  if (S.catalog) return S.catalog;
  if (!S._catP) S._catP = fetchPublic('catalog.json').then(c => {
    if (!c) throw new Error('Brak katalogu – bot jeszcze ani razu się nie uruchomił.');
    S.catalog = c; S.catMap = new Map(c.p.map(r => [r[0], r]));
    c.p.forEach(r => { r.lc = (r[1] + ' ' + (c.exp[r[3]] || '')).toLowerCase(); });
    return c;
  }).catch(e => { S._catP = null; throw e; });
  return S._catP;
}

async function saveVault(msg) {
  const revert = () => { S.vault = JSON.parse(S.vaultSaved); };
  if (S.readOnly) { revert(); toast('Tryb tylko do odczytu – nic nie zapisano. Dodaj token GitHub w Ustawieniach.', 4500); return false; }
  S.vault.updated = new Date().toISOString();
  const blob = await encryptBlob(S.vault, S.pw, S.vaultSalt);
  try {
    const r = await GH.putFile('docs/vault.enc', JSON.stringify(blob), S.vaultSha, msg || 'skarbiec: zmiana');
    S.vaultSha = r.content.sha; S.vaultSaved = JSON.stringify(S.vault); toast('Zapisano ✓ Bot uwzględni zmiany przy najbliższym pomiarze.');
    syncTargets();
    return true;
  } catch (e) {
    revert();
    if (/ 409| 422/.test(e.message)) toast('Skarbiec zmienił się na innym urządzeniu – odśwież stronę i spróbuj ponownie.', 5000);
    else toast('Nie zapisano: ' + e.message, 5000);
    return false;
  }
}

function killCharts() { S.charts.forEach(c => c.destroy()); S.charts = []; }
function lineChart(canvas, labels, sets, { money = 'E', target = null, targetLabel = 'Próg' } = {}) {
  if (!window.Chart || !canvas) return;
  const fmt = money === 'P' ? P : E;
  const grid = css('--grid'), muted = css('--muted');
  const datasets = sets.map(s => ({
    label: s.label, data: s.data, borderColor: s.color, backgroundColor: s.color, borderWidth: 2, borderDash: s.dash || [],
    pointRadius: labels.length <= 2 ? 4 : 0, pointHoverRadius: 5, pointHitRadius: 12, tension: 0.15, spanGaps: true, fill: false,
  }));
  if (target != null) datasets.push({ label: targetLabel, data: labels.map(() => target), borderColor: css('--s4'), borderWidth: 1.5, borderDash: [6, 4], pointRadius: 0, pointHitRadius: 0 });
  S.charts.push(new Chart(canvas, {
    type: 'line', data: { labels: labels.map(d => d.length === 10 ? new Date(d + 'T12:00:00').toLocaleDateString('pl-PL', { day: 'numeric', month: 'short' }) : d), datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)}` } } },
      scales: {
        x: { grid: { display: false }, border: { color: css('--axis') }, ticks: { color: muted, maxTicksLimit: 7, maxRotation: 0 } },
        y: { grid: { color: grid }, border: { display: false }, ticks: { color: muted, maxTicksLimit: 5, callback: v => fmt(v).replace(/,00/, '') } },
      },
    },
  }));
}
function legend(items) { return `<div class="legend">${items.map(([l, c, dash]) => `<span><i class="${dash ? 'dash' : ''}" style="background:${c};color:${c}"></i>${esc(l)}</span>`).join('')}</div>`; }
function spark(vals, w = 84, h = 24) {
  const v = vals.filter(x => x != null); if (v.length < 2) return '<span class="muted">—</span>';
  const lo = Math.min(...v), hi = Math.max(...v), r = hi - lo || 1;
  const pts = v.map((x, i) => `${(i / (v.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 2 - (x - lo) / r * (h - 4)).toFixed(1)}`).join(' ');
  const col = v.at(-1) >= v[0] ? 'var(--good-ink)' : 'var(--critical)';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
const KC = { buy: '--s3', drop: '--s8', info: '--s1', profit: '--s4', tax: '--s7', warn: '--s2' };
const KL = { buy: 'Okazja', drop: 'Spadek', info: 'Info', profit: 'Zysk', tax: 'Podatek', warn: 'Uwaga' };
function alertList(list) {
  if (!list.length) return '<div class="empty">Brak alertów. Bot napisze na Discordzie, gdy coś się wydarzy.</div>';
  return list.map(a => `<div class="alert-item"><span class="k" style="background:var(${KC[a.kind] || '--muted'})"></span><div style="min-width:0"><div class="t">${esc(a.title)}</div><div class="d">${esc(a.text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</div><div class="muted" style="font-size:12px;margin-top:2px">${dPL(a.d)} · ${KL[a.kind] || ''}</div></div></div>`).join('');
}

// ---------------- portfel: obliczenia ----------------
function holdingsCalc() {
  const fx = fxNow();
  const active = [], sold = [];
  for (const h of S.vault.portfolio || []) {
    const m = itemMeta(h), p = nowPrice(h);
    const value = p?.trend != null ? p.trend * (h.qty || 1) * fx : null;
    const row = { h, m, p, value, cost: +h.cost_pln || 0 };
    row.pl = value != null ? value - row.cost : null; row.plp = pct(value, row.cost);
    row.d7 = pct(p?.trend, valueAgo(keyOf(h), 7));
    row.free = h.date ? taxFreeFrom(h.date) : null;
    (h.sold ? sold : active).push(row);
  }
  const value = active.reduce((a, r) => a + (r.value || 0), 0), cost = active.reduce((a, r) => a + r.cost, 0);
  const realized = sold.reduce((a, r) => a + ((+r.h.sold.price_pln || 0) - r.cost), 0);
  return { active, sold, value, cost, realized, unpriced: active.filter(r => r.value == null).length };
}

// Zdjęcie → Claude Haiku 5.5 odczytuje nazwę i numer → TCGdex daje kartę i idProduct Cardmarketu → kolejka do zatwierdzenia → portfel.
const AI_MODEL = 'claude-haiku-5-5', AI_PRICE = { in: 0.10, out: 0.50 };   // $ za 1 mln tokenów
const AI_SDK = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.132.1/+esm';
const SCAN_SYSTEM = `You identify Pokémon Trading Card Game cards in photos. List every card that is visible (a binder page can hold 9 or more; a photo may also show a single card).
For each card read the text printed on the card itself:
- name: the card name exactly as printed, including suffixes like "ex", "V", "VMAX", "GX" and possessive trainer names ("Erika's Oddish"). Japanese cards: write the name in Japanese as printed.
- number: the collector number before the slash, as printed (e.g. "215", "025", "TG23", "SV107", "GG56"); promos without a slash: the promo number (e.g. "131", "SWSH020").
- set_total: the number after the slash ("203"), or "" if there is none.
- set_code: the small set or promo code printed near the number (e.g. "EVS", "M-P", "SVP"), or "".
- language: "en" for English cards, "ja" for Japanese, otherwise "other".
- variant: "reverse_holo" when the whole card frame except the artwork is foil, "holo" when only the artwork is foil, "normal" when there is no foil, "unknown" if you cannot tell.
- position: where the card is in the photo in Polish (e.g. "lewy górny", "środek", "całe zdjęcie").
- confidence: "high" only when you can clearly read both name and number.
Skip card backs, sleeves without visible text, and non-card objects. If nothing is readable, return an empty list.`;
const SCAN_SCHEMA = { type: 'object', additionalProperties: false, required: ['cards'], properties: { cards: { type: 'array', items: { type: 'object', additionalProperties: false,
  required: ['name', 'number', 'set_total', 'set_code', 'language', 'variant', 'position', 'confidence'],
  properties: { name: { type: 'string' }, number: { type: 'string' }, set_total: { type: 'string' }, set_code: { type: 'string' },
    language: { type: 'string', enum: ['en', 'ja', 'other'] }, variant: { type: 'string', enum: ['normal', 'holo', 'reverse_holo', 'unknown'] },
    position: { type: 'string' }, confidence: { type: 'string', enum: ['high', 'medium', 'low'] } } } } } };
const SC = { jobs: [], cost: 0, date: todayISO(), busy: 0 };
let _ai = null;
async function aiClient() {
  const key = ls.get('skarbiec_ak');
  if (!key) throw new Error('Brak klucza API Anthropic – wklej go w Ustawieniach (Skaner zdjęć).');
  if (!_ai || _ai.key !== key) {
    const { default: Anthropic } = await import(AI_SDK);
    _ai = { key, c: new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true, ...(ls.get('skarbiec_ai_base') ? { baseURL: ls.get('skarbiec_ai_base') } : {}) }) };   // skarbiec_ai_base: tylko testy lokalne
  }
  return _ai.c;
}
function aiError(e) {
  const s = e?.status, m = e?.error?.error?.message || e?.message || String(e);
  if (s === 401) return 'Zły klucz API Anthropic.';
  if (s === 400 && /credit|balance/i.test(m)) return 'Brak środków na koncie API Anthropic (console.anthropic.com → Billing).';
  if (s === 429) return 'Za dużo zapytań naraz – spróbuj za minutę.';
  if (s >= 500) return 'Serwery Anthropic są przeciążone – spróbuj ponownie.';
  return m;
}
async function scaleImage(file, max, type, q) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height); bmp.close?.();
  return new Promise((ok, no) => cv.toBlob(b => b ? ok(b) : no(new Error('Nie udało się przetworzyć zdjęcia.')), type, q));
}

// TCGdex – darmowe API z kartami; podaje m.in. idProduct Cardmarketu
const TD = 'https://api.tcgdex.net/v2', tdCache = new Map();
const td = path => { if (!tdCache.has(path)) tdCache.set(path, fetch(`${TD}/${path}`).then(r => r.ok ? r.json() : null).catch(() => { tdCache.delete(path); return null; })); return tdCache.get(path); };
const normNo = s => String(s || '').toUpperCase().replace(/\s/g, '').replace(/^([A-Z]*)0+(?=\d)/, '$1');
async function resolveCard(c) {
  const lang = c.language === 'ja' ? 'ja' : 'en';
  const sets = await td(`${lang}/sets`) || [], setById = new Map(sets.map(s => [s.id, s]));
  const no = normNo(c.number), tot = parseInt(c.set_total, 10) || null, setOf = id => id.slice(0, id.lastIndexOf('-'));
  const byName = async n => n ? await td(`${lang}/cards?name=${encodeURIComponent(n)}`) || [] : [];
  let brief = await byName(c.name.trim());
  if (!brief.length) { const w = c.name.split(/\s+/).sort((a, b) => b.length - a.length)[0]; if (w && w.length >= 3 && w !== c.name.trim()) brief = await byName(w); }
  let cand = no ? brief.filter(b => normNo(b.localId) === no) : brief;
  if (tot && cand.length > 1) { const f = cand.filter(b => setById.get(setOf(b.id))?.cardCount?.official === tot); if (f.length) cand = f; }
  if (!cand.length && no && tot) {   // nazwa źle odczytana – szukamy po wielkości dodatku i numerze
    for (const s of sets.filter(s => s.cardCount?.official === tot).slice(-6)) {
      const hit = (await td(`${lang}/sets/${encodeURIComponent(s.id)}`))?.cards?.find(x => normNo(x.localId) === no);
      if (hit) cand.push(hit);
    }
  }
  const full = (await Promise.all(cand.slice(0, 8).map(b => td(`${lang}/cards/${encodeURIComponent(b.id)}`)))).filter(Boolean);
  const out = full.map(f => ({
    tid: f.id, name: f.name, set: f.set?.name || '', no: f.localId, total: f.set?.cardCount?.official, rarity: f.rarity || '',
    img: f.image ? `${f.image}/low.webp` : null,
    idp: +(f.pricing?.cardmarket?.idProduct || f.variants_detailed?.find(v => v.thirdParty?.cardmarket)?.thirdParty?.cardmarket || 0) || null,
  })).sort((a, b) => (catRow(b.idp) ? 1 : 0) - (catRow(a.idp) ? 1 : 0));
  // karty bez produktu na Cardmarket (np. TCG Pocket) odpadają, jeśli są inne kandydatury
  return out.some(x => x.idp) ? out.filter(x => x.idp) : out;
}
function cmLink(id, fallbackName, holo) {
  // Cardmarket przekierowuje /Products?idProduct=X na dokładną stronę produktu (sprawdzone 23.10.2026); filtr EN, NM i lepsze
  if (!(+id > 0)) return null;
  return `https://www.cardmarket.com/en/Pokemon/Products?idProduct=${+id}&language=1&minCondition=2${holo ? '&isReverseHolo=Y' : ''}`;
}
const cmA = (id, name, holo) => { const u = cmLink(id, name, holo); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener" title="Otwórz na Cardmarket" onclick="event.stopPropagation()">↗</a>` : ''; };
const scPrice = (card, holo) => { const r = catRow(card?.idp); return r ? (holo ? r[9] || r[4] : r[4]) : null; };

async function scanJob(j) {
  j.status = 'analiza'; scQueue();
  try {
    const api = await scaleImage(j.file, 1568, 'image/jpeg', 0.85);
    const client = await aiClient();
    const msg = await client.messages.create({
      model: AI_MODEL, max_tokens: 4096, thinking: { type: 'disabled' }, system: SCAN_SYSTEM,
      output_config: { format: { type: 'json_schema', schema: SCAN_SCHEMA } },
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64e(new Uint8Array(await api.arrayBuffer())) } },
        { type: 'text', text: 'Rozpoznaj karty na tym zdjęciu.' }] }],
    });
    const cost = (msg.usage.input_tokens * AI_PRICE.in + msg.usage.output_tokens * AI_PRICE.out) / 1e6;
    SC.cost += cost; j.cost = cost;
    if (msg.stop_reason === 'refusal') throw new Error('Model odmówił analizy tego zdjęcia.');
    if (msg.stop_reason === 'max_tokens') throw new Error('Za dużo kart na jednym zdjęciu – podziel je na mniejsze.');
    const out = JSON.parse(msg.content.find(b => b.type === 'text')?.text || '{"cards":[]}');
    j.status = 'dopasowanie'; scQueue();
    try { await loadCatalog(); } catch {}
    j.cards = await Promise.all((out.cards || []).map(async det => {
      const cands = await resolveCard(det);
      return { det, cands, sel: cands.length ? 0 : -1, holo: det.variant === 'reverse_holo', qty: 1, cost: '', on: cands.length === 1 && !!cands[0].idp && det.confidence === 'high' };
    }));
    j.status = 'gotowe';
  } catch (e) { j.status = 'błąd'; j.err = aiError(e); }
  scQueue();
  if (j.status === 'gotowe') savePhoto(j);
}
async function savePhoto(j) {   // każde zrobione zdjęcie trafia do prywatnego repo, niezależnie od tego, co z niego dodasz
  if (S.readOnly || !GH.token || j.photo) return;
  try {
    let blob = await scaleImage(j.file, 2000, 'image/webp', 0.82);
    if (blob.type !== 'image/webp') blob = await scaleImage(j.file, 2000, 'image/jpeg', 0.85);   // Safari bez WebP
    const d = todayISO(), path = `foto/${d.slice(0, 4)}/${d.slice(5, 7)}/${d}-${uid()}.${blob.type === 'image/webp' ? 'webp' : 'jpg'}`;
    await PHOTOS.put(path, blob, `foto: ${j.cards.length} kart`);
    j.photo = path; j.photoErr = null;
    PHOTOS.urls.set(path, Promise.resolve(j.url));

async function scApprove() {

  for (const j of new Set(sel.map(x => x.j))) if (!j.photo) await savePhoto(j);

    const r = catRow(card.idp);
    return { uid: uid(), id: card.idp, holo: !!c.holo, name: r ? r[1] : card.name, set: (r && S.catalog.exp[r[3]]) || card.set, kind: 'S',
      qty: c.qty, date: SC.date, cost_pln: +(+c.cost || 0).toFixed(2), note: `${card.set} ${card.no}`.trim(), sold: null, tcgdex: card.tid, ...(j.photo ? { photos: [j.photo] } : {}) };
  });
  const scans = new Map();
  for (const { j } of sel) if (j.photo) scans.set(j.photo, { path: j.photo, date: todayISO(), n: j.cards.length });
  S.vault.portfolio = [...(S.vault.portfolio || []), ...recs];
  S.vault.scans = [...(S.vault.scans || []).filter(s => !scans.has(s.path)), ...scans.values()].slice(-500);
  if (await saveVault(`skaner: +${recs.length} kart`)) {
    sel.forEach(({ c }) => { c.on = false; c.added = true; });
    SC.jobs = SC.jobs.filter(j => j.cards.some(c => !c.added && c.cands.length) || j.status !== 'gotowe');
    toast(`Dodano ${recs.length} kart do portfela ✓`);
  }
  render();
}

function mountPicker(d, onPick) {
  let kind = 'all';
  const run = () => {
    if (!S.catalog) return;
    const q = $('#pk-q', d).value.trim(), res = $('#pk-res', d);
    if (q.length < 2) { res.innerHTML = '<p class="muted">Wpisz co najmniej 2 znaki.</p>'; return; }
    const { rows, total } = searchCatalog(q, { kind, sort: 'price', limit: 40 });
    res.innerHTML = `<table class="tbl"><tr><th>Produkt</th><th>Trend</th><th></th></tr>${rows.map(r => `<tr><td class="name"><div class="nm">${esc(r[1])}<small>${esc([S.catalog.exp[r[3]], KIND[S.catalog.kinds[r[2]]]].filter(Boolean).join(' · '))}</small></div></td><td>${E(r[4])}</td><td><button class="btn sm primary" data-pick="${r[0]}">Wybierz</button>${r[9] ? ` <button class="btn sm" data-pick="${r[0]}" data-holo="1" title="Wersja Reverse Holo">RH</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Nic nie znaleziono.</td></tr>'}</table>${total > rows.length ? `<p class="muted" style="font-size:12px">Pokazuję ${rows.length} z ${total} – doprecyzuj wyszukiwanie.</p>` : ''}`;
  };
  $('#pk-q', d).addEventListener('input', run);
  $('#pk-k', d).addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; kind = b.dataset.k; $('#pk-k', d).querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b)); run(); });
  $('#pk-res', d).addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b) onPick({ id: +b.dataset.pick, holo: !!b.dataset.holo }); });
  loadCatalog().then(() => { run(); $('#pk-q', d).focus(); }).catch(e => { $('#pk-res', d).textContent = e.message; });
}
function snapshotMeta(it) { const r = catRow(it.id); return r ? { name: r[1], set: S.catalog.exp[r[3]] || '', kind: S.catalog.kinds[r[2]] } : {}; }

function formAddWatch(it) {
  const wls = S.vault.watchlists || [];
  const p = nowPrice(it), m = itemMeta(it);
  modal('Dodaj do watchlisty', `<p style="margin-top:0"><b>${esc(m.name)}</b><br><span class="muted">${esc(m.set)} · trend ${E(p?.trend)}</span></p>
    <div class="grid g2" style="gap:10px">
      <label class="f">Lista<select id="aw-l">${wls.map(w => `<option value="${esc(w.id)}" ${w.id === S.wl ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}<option value="__new">+ nowa lista…</option></select></label>
      <label class="f">Nazwa nowej listy<input type="text" id="aw-n" placeholder="np. Sealed do kupienia"></label>
      <label class="f">Ilość (do sumy listy)<input type="number" id="aw-q" value="1" min="1"></label>
      <label class="f">Kup poniżej (€, opcjonalnie)<input type="number" id="aw-b" step="0.01" min="0" placeholder="${p?.trend ? (p.trend * 0.8).toFixed(0) : ''}"></label>
    </div><div class="row" style="margin-top:14px"><button class="btn primary" id="aw-ok">Dodaj</button><button class="btn" data-close>Anuluj</button></div>`, d => {
    const toggle = () => { $('#aw-n', d).closest('label').style.display = $('#aw-l', d).value === '__new' ? '' : 'none'; };
    $('#aw-l', d).addEventListener('change', toggle); toggle();
    $('#aw-ok', d).onclick = async () => {
      let wl;
      if ($('#aw-l', d).value === '__new') { const n = $('#aw-n', d).value.trim(); if (!n) return toast('Podaj nazwę listy.'); wl = { id: uid(), name: n, items: [] }; S.vault.watchlists = [...wls, wl]; }
      else wl = wls.find(w => w.id === $('#aw-l', d).value);
      if ((wl.items || []).some(x => keyOf(x) === keyOf(it))) return toast('Ta pozycja już jest na tej liście.');
      const bb = parseFloat($('#aw-b', d).value);
      wl.items = [...(wl.items || []), { id: it.id, holo: !!it.holo, ...snapshotMeta(it), qty: Math.max(1, +$('#aw-q', d).value || 1), ...(bb > 0 ? { buy_below: bb } : {}) }];
      S.wl = wl.id; d.close(); await saveVault(`watchlista: +${m.name}`); render();
    };
  });
}

function formHolding(base, existing) {
  const it = existing || base, m = itemMeta(it), p = nowPrice(it);
  const curCost = existing ? existing.cost_pln : '';
  modal(existing ? 'Edytuj pozycję' : 'Dodaj do portfela', `<p style="margin-top:0"><b>${esc(m.name)}</b><br><span class="muted">${esc(m.set)} · trend ${E(p?.trend)} (≈ ${P(p?.trend * fxNow())})</span></p>
    <div class="grid g2" style="gap:10px">
      <label class="f">Ilość<input type="number" id="h-q" value="${existing?.qty || 1}" min="1"></label>
      <label class="f">Data zakupu<input type="date" id="h-d" value="${existing?.date || todayISO()}" max="${todayISO()}"></label>
      <label class="f">Łączny koszt zakupu (z wysyłką)<input type="number" id="h-c" step="0.01" min="0" value="${curCost}"></label>
      <label class="f">Waluta<select id="h-cur"><option value="PLN">PLN</option><option value="EUR">EUR (przeliczę po kursie ${fxNow().toFixed(4).replace('.', ',')})</option></select></label>
      <label class="f" style="grid-column:1/-1">Notatka (np. gdzie kupione, stan, PSA)<input type="text" id="h-n" value="${esc(existing?.note || '')}"></label>
    </div>
    ${existing?.sold ? `<div class="banner" style="margin-top:10px">Sprzedane ${dPL(existing.sold.date)} za ${P(existing.sold.price_pln)}. <button class="btn sm" id="h-unsell">Cofnij sprzedaż</button></div>` : ''}
    <div class="spread" style="margin-top:14px"><div class="row"><button class="btn primary" id="h-ok">${existing ? 'Zapisz' : 'Dodaj'}</button><button class="btn" data-close>Anuluj</button></div>${existing ? '<button class="btn danger" id="h-del">Usuń</button>' : ''}</div>`, d => {
    $('#h-ok', d).onclick = async () => {
      let cost = parseFloat($('#h-c', d).value); if (!(cost >= 0)) return toast('Podaj koszt zakupu.');
      if ($('#h-cur', d).value === 'EUR') cost = +(cost * fxNow()).toFixed(2);
      const rec = existing || { uid: uid(), id: it.id, holo: !!it.holo, ...snapshotMeta(it), sold: null };
      Object.assign(rec, { qty: Math.max(1, +$('#h-q', d).value || 1), date: $('#h-d', d).value || null, cost_pln: cost, note: $('#h-n', d).value.trim() });
      if (!existing) S.vault.portfolio = [...(S.vault.portfolio || []), rec];
      d.close(); await saveVault(`portfel: ${existing ? 'zmiana' : '+'} ${m.name}`); render();
    };
    if (existing) {
      $('#h-del', d).onclick = async () => { if (!confirm('Usunąć tę pozycję z portfela?')) return; S.vault.portfolio = S.vault.portfolio.filter(x => x.uid !== existing.uid); d.close(); await saveVault('portfel: usunięto'); render(); };
      const un = $('#h-unsell', d); if (un) un.onclick = async () => { existing.sold = null; d.close(); await saveVault('portfel: cofnięto sprzedaż'); render(); };
    }
  });
}

function formSell(h) {
  const m = itemMeta(h), p = nowPrice(h), free = h.date ? taxFreeFrom(h.date) : null;
  modal('Oznacz jako sprzedane', `<p style="margin-top:0"><b>${esc(m.name)}</b> · ${h.qty || 1} szt. · koszt ${P(h.cost_pln)}<br><span class="muted">wartość wg trendu ${P((p?.trend || 0) * (h.qty || 1) * fxNow())}</span></p>
    <div class="grid g2" style="gap:10px"><label class="f">Za ile sprzedałeś (razem, PLN, po kosztach)<input type="number" id="s-p" step="0.01" min="0"></label><label class="f">Data sprzedaży<input type="date" id="s-d" value="${todayISO()}"></label></div>
    ${free && todayISO() < free ? `<div class="banner" style="margin-top:10px">⚠️ Do ${dPL(free)} nie minęło pół roku od końca miesiąca zakupu. Sprzedaż przed tą datą jest przychodem do opodatkowania PIT (sprzedaż prywatna).</div>` : ''}
    <div class="row" style="margin-top:14px"><button class="btn primary" id="s-ok">Zapisz sprzedaż</button><button class="btn" data-close>Anuluj</button></div>`, d => {
    $('#s-ok', d).onclick = async () => { const pr = parseFloat($('#s-p', d).value); if (!(pr >= 0)) return toast('Podaj kwotę sprzedaży.'); h.sold = { date: $('#s-d', d).value || todayISO(), price_pln: pr }; d.close(); await saveVault('portfel: sprzedaż'); render(); };
  });
}

function formWatchlist(wl) {
  modal(wl ? 'Ustawienia listy' : 'Nowa watchlista', `<div class="grid g2" style="gap:10px">
    <label class="f">Nazwa<input type="text" id="w-n" value="${esc(wl?.name || '')}" placeholder="np. Ascended Heroes SIR"></label>
    <label class="f">Próg okazji – suma listy w € (opcjonalnie)<input type="number" id="w-t" step="1" min="0" value="${wl?.target_eur ?? ''}"></label>
    <label class="f">Liczona wg<select id="w-m"><option value="trend">trendu (szybko reaguje)</option><option value="avg7" ${wl?.metric === 'avg7' ? 'selected' : ''}>średniej 7 dni (spokojniejsza)</option></select></label></div>
    <div class="spread" style="margin-top:14px"><div class="row"><button class="btn primary" id="w-ok">${wl ? 'Zapisz' : 'Utwórz'}</button><button class="btn" data-close>Anuluj</button></div>${wl ? '<button class="btn danger" id="w-del">Usuń listę</button>' : ''}</div>`, d => {
    $('#w-ok', d).onclick = async () => {
      const n = $('#w-n', d).value.trim(); if (!n) return toast('Podaj nazwę.');
      const t = parseFloat($('#w-t', d).value), rec = wl || { id: uid(), items: [] };
      Object.assign(rec, { name: n, target_eur: t > 0 ? t : null, metric: $('#w-m', d).value });
      if (!wl) S.vault.watchlists = [...(S.vault.watchlists || []), rec];
      S.wl = rec.id; d.close(); await saveVault(`watchlista: ${n}`); render();
    };
    if (wl) $('#w-del', d).onclick = async () => { if (!confirm(`Usunąć listę „${wl.name}”?`)) return; S.vault.watchlists = S.vault.watchlists.filter(x => x.id !== wl.id); S.wl = null; d.close(); await saveVault('watchlista: usunięto'); render(); };
  });
}

function formItem(wl, it) {
  const m = itemMeta(it);
  modal('Pozycja na liście', `<p style="margin-top:0"><b>${esc(m.name)}</b><br><span class="muted">${esc(wl.name)}</span></p>
    <div class="grid g2" style="gap:10px"><label class="f">Ilość<input type="number" id="i-q" value="${it.qty || 1}" min="1"></label><label class="f">Kup poniżej (€)<input type="number" id="i-b" step="0.01" min="0" value="${it.buy_below ?? ''}"></label></div>
    <div class="spread" style="margin-top:14px"><div class="row"><button class="btn primary" id="i-ok">Zapisz</button><button class="btn" data-close>Anuluj</button></div><button class="btn danger" id="i-del">Usuń z listy</button></div>`, d => {
    $('#i-ok', d).onclick = async () => { it.qty = Math.max(1, +$('#i-q', d).value || 1); const b = parseFloat($('#i-b', d).value); if (b > 0) it.buy_below = b; else delete it.buy_below; d.close(); await saveVault('watchlista: zmiana pozycji'); render(); };
    $('#i-del', d).onclick = async () => { wl.items = wl.items.filter(x => x !== it); d.close(); await saveVault('watchlista: usunięto pozycję'); render(); };
  });
}

function formImport() {
  modal('Import z Tampermonkey', `<p style="margin-top:0">Otwórz Wants Listę na Cardmarket z końcówką <code>#track</code>, kliknij <b>🤖 Konfiguracja dla bota</b> i wklej tutaj. Możesz wkleić też kilka list naraz (w nawiasach [ ]).</p>
    <textarea id="im-t" rows="8" style="width:100%;font-family:ui-monospace,monospace;font-size:12px" placeholder='{"name": "...", "products": [123, 456], "target": 1500}'></textarea>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="im-ok">Importuj</button><button class="btn" data-close>Anuluj</button></div>`, d => {
    $('#im-ok', d).onclick = async () => {
      let data; try { data = JSON.parse($('#im-t', d).value); } catch { return toast('To nie jest poprawny JSON.'); }
      try { await loadCatalog(); } catch {}
      const lists = Array.isArray(data) ? data : data.watches || [data];
      let n = 0;
      for (const w of lists) {
        if (!w || !Array.isArray(w.products)) continue;
        const items = w.products.map(p => typeof p === 'object' ? { id: +p.id, holo: !!p.holo, name: p.name, url: p.url } : { id: +p, holo: false })
          .map(it => { const m = snapshotMeta(it); return { ...it, ...m, name: m.name || it.name || undefined, ...(it.url ? { url: it.url } : {}), qty: 1 }; });
        const ex = (S.vault.watchlists || []).find(x => x.name === w.name);
        if (ex) { if (!confirm(`Lista „${w.name}” już istnieje. Zastąpić jej pozycje?`)) continue; ex.items = items; if (w.target) ex.target_eur = +w.target; S.wl = ex.id; }
        else { const rec = { id: uid(), name: w.name || 'Lista z Cardmarket', items, target_eur: w.target ? +w.target : null, metric: 'trend' }; S.vault.watchlists = [...(S.vault.watchlists || []), rec]; S.wl = rec.id; }
        n++;
      }
      if (!n) return toast('Nie znalazłem list do zaimportowania.');
      d.close(); S.tab = 'watch'; await saveVault(`import ${n} list z Tampermonkey`); render();
    };
  });
}

const ACT = {
  tab: a => { S.tab = a.dataset.id; render(); window.scrollTo(0, 0); },
  theme: () => { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const n = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; ls.set('skarbiec_theme', n); render(); },
  openwl: a => { S.wl = a.dataset.id; S.tab = 'watch'; render(); },
  newwl: () => formWatchlist(null),
  editwl: () => formWatchlist((S.vault.watchlists || []).find(w => w.id === S.wl)),
  edititem: a => { const wl = S.vault.watchlists.find(w => w.id === S.wl); const it = wl.items.find(x => keyOf(x) === a.dataset.k); if (it) formItem(wl, it); },
  exportwl: () => { const wl = S.vault.watchlists.find(w => w.id === S.wl); const txt = JSON.stringify({ name: wl.name, products: wl.items.map(i => i.holo ? { id: i.id, holo: true } : i.id), ...(wl.target_eur ? { target: wl.target_eur } : {}) }, null, 1); navigator.clipboard.writeText(txt).then(() => toast('Skopiowano JSON listy.'), () => prompt('Skopiuj:', txt)); },
  importTM: () => formImport(),
  detail: a => openDetail(+a.dataset.id, !!a.dataset.holo),
  addto: a => modal(a.dataset.mode === 'portfel' ? 'Dodaj do portfela' : 'Dodaj do watchlisty', pickerHTML(), d => mountPicker(d, it => { d.close(); a.dataset.mode === 'portfel' ? formHolding(it) : formAddWatch(it); })),
  sell: a => formSell(S.vault.portfolio.find(x => x.uid === a.dataset.uid)),
  edithold: a => { const h = S.vault.portfolio.find(x => x.uid === a.dataset.uid); formHolding(h, h); },
  rkind: a => { R.kind = a.dataset.k; document.querySelectorAll('[data-act="rkind"]').forEach(c => c.setAttribute('aria-pressed', c === a)); rynekResults(); },
  savegh: async () => {
    ls.set('skarbiec_repo', $('#s-repo').value.trim() || null); ls.set('skarbiec_token', $('#s-token').value.trim() || null); S.branch = null;
    const out = $('#s-ghres'); out.innerHTML = '<span class="spin"></span>';
    try { const f = await GH.getFile('docs/vault.enc'); if (!f) throw new Error('w repozytorium nie ma docs/vault.enc'); S.vaultSha = f.sha; S.readOnly = false; out.innerHTML = '<span class="up">✓ Połączono – zapisywanie włączone</span>'; shell(); S.tab = 'ustawienia'; render(); }
    catch (e) { S.readOnly = true; out.innerHTML = `<span class="down">${esc(e.message)}</span>`; }
  },
  runbot: async () => { try { await GH.runBot(false); toast('Bot uruchomiony. Odśwież stronę za ok. 2–3 minuty.', 4000); } catch (e) { toast(e.message, 5000); } },
  testdc: async () => { try { await GH.runBot(true); toast('Wysłano. Wiadomość na Discordzie za ok. 30–60 s.', 4000); } catch (e) { toast(e.message, 5000); } },
  savesettings: async () => {
    const day = +$('#s-sumday').value;
    S.vault.settings = { ...DEFAULT_SETTINGS, ...(S.vault.settings || {}),
      drop_alert_pct: +$('#s-drop').value || 10, card_drop_alert_pct: +$('#s-card').value || 25, dip_alert_pct: +$('#s-dip').value || 20,
      profit_steps: $('#s-profit').value.split(/[,; ]+/).map(Number).filter(x => x > 0).sort((a, b) => a - b),
      weekly_summary: day >= 0, summary_weekday: Math.max(0, day) };
    await saveVault('ustawienia alertów');
  },
  backup: () => { const b = new Blob([JSON.stringify(S.vault, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `skarbiec-kopia-${todayISO()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); },
  logout: () => { ls.set('skarbiec_pw', null); location.reload(); },
  forget: () => { if (!confirm('Usunąć z tej przeglądarki zapamiętane hasło, token GitHub i klucz API?')) return; ['skarbiec_pw', 'skarbiec_token', 'skarbiec_repo', 'skarbiec_api', 'skarbiec_ak', 'skarbiec_photo_repo'].forEach(k => ls.set(k, null)); location.reload(); },
  saveai: async () => {
    ls.set('skarbiec_ak', $('#s-ak').value.trim() || null); ls.set('skarbiec_photo_repo', $('#s-prepo').value.trim() || null); PHOTOS.branch = null;
    const out = $('#s-aires'), res = []; out.innerHTML = '<span class="spin"></span>';
    try { await (await aiClient()).models.retrieve(AI_MODEL); res.push('<span class="up">✓ klucz API działa</span>'); }
    catch (e) { res.push(`<span class="down">${esc(aiError(e))}</span>`); }
    try { const r = await GH.call('', {}, PHOTOS.repo); res.push(r.private ? '<span class="up">✓ repo zdjęć (prywatne)</span>' : '<span class="down">⚠ repo zdjęć jest PUBLICZNE – zmień na prywatne</span>'); }
    catch (e) { res.push(`<span class="down">repo zdjęć: ${esc(/ 404/.test(e.message) ? 'nie istnieje albo token nie ma do niego dostępu' : e.message)}</span>`); }
    out.innerHTML = res.join(' · ');
  },
  scApprove: () => scApprove(),
  scClear: () => { SC.jobs = SC.jobs.filter(j => !['gotowe', 'błąd'].includes(j.status)); scQueue(); },
  scDrop: a => { SC.jobs = SC.jobs.filter(j => j.id !== a.dataset.j); scQueue(); },
  scRetry: a => { const j = SC.jobs.find(x => x.id === a.dataset.j); if (j) { j.status = 'czeka'; j.err = null; scQueue(); scPump(); } },
  scPhoto: a => { const j = SC.jobs.find(x => x.id === a.dataset.j); if (j) { j.photoErr = null; savePhoto(j); } },
  scManual: a => {
    const j = SC.jobs.find(x => x.id === a.dataset.j), c = j?.cards[+a.dataset.c]; if (!c) return;
    modal('Wybierz kartę ręcznie', pickerHTML(), d => {
      mountPicker(d, it => { const r = catRow(it.id); c.cands = [{ tid: null, name: r?.[1] || `#${it.id}`, set: S.catalog.exp[r?.[3]] || '', no: c.det.number, total: c.det.set_total, rarity: '', img: null, idp: it.id }]; c.sel = 0; c.holo = it.holo; c.on = true; d.close(); scQueue(); });
      $('#pk-q', d).value = c.det.name;
    });
  },
  photo: a => openPhotos([a.dataset.path]),
  holdphotos: a => { const h = S.vault.portfolio.find(x => x.uid === a.dataset.uid); if (h?.photos?.length) openPhotos(h.photos, itemMeta(h).name); },
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || !ACT[a.dataset.act]) return;
  if (a.tagName === 'A') e.preventDefault();
  ACT[a.dataset.act](a, e);
});

function loginScreen(err, setup) {
  $('#app').innerHTML = `<div class="login"><form class="card stack" id="lf">
    <div class="logo" style="font-size:20px"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><rect x="9" y="6" width="14" height="20" rx="2" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M12 19l3-3 2 2 3-4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Skarbiec</div>
    ${setup ? `<p style="margin:0">Pierwsze uruchomienie: załóż skarbiec. Hasło szyfruje twoje dane – <b>bez niego nie da się ich odczytać</b>, więc go nie zgub.</p>
      <label class="f">Repozytorium<input type="text" id="l-repo" value="${esc(GH.repo)}" placeholder="login/skarbiec" required></label>
      <label class="f">Token GitHub<input type="password" id="l-token" value="${esc(GH.token)}" placeholder="github_pat_…" required autocomplete="off"></label>
      <label class="f">Nowe hasło (min. 10 znaków)<input type="password" id="l-pw" minlength="10" required autocomplete="new-password"></label>
      <label class="f">Powtórz hasło<input type="password" id="l-pw2" minlength="10" required autocomplete="new-password"></label>`
    : `<label class="f">Hasło<input type="password" id="l-pw" required autocomplete="current-password" autofocus></label>
      <label class="row" style="font-size:13px;color:var(--ink-2)"><input type="checkbox" id="l-rem"> Zapamiętaj na tym urządzeniu (nie na cudzym komputerze)</label>`}
    ${err ? `<div class="down" role="alert">${esc(err)}</div>` : ''}
    <button class="btn primary" type="submit">${setup ? 'Załóż skarbiec' : 'Zaloguj'}</button>
    <p class="muted" style="font-size:12px;margin:0">Dane są szyfrowane w przeglądarce (AES-256). Hasło nie jest nigdzie wysyłane.</p>
  </form></div>`;
  $('#lf').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('button[type=submit]', e.target); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Chwila…';
    try {
      if (setup) {
        const pw = $('#l-pw').value; if (pw !== $('#l-pw2').value) throw new Error('Hasła się różnią.');
        ls.set('skarbiec_repo', $('#l-repo').value.trim()); ls.set('skarbiec_token', $('#l-token').value.trim());
        if (await GH.getFile('docs/vault.enc')) throw new Error('Skarbiec już istnieje w tym repozytorium – odśwież stronę i zaloguj się.');
        const vault = { v: 1, settings: { ...DEFAULT_SETTINGS }, watchlists: [], portfolio: [], created: new Date().toISOString() };
        const blob = await encryptBlob(vault, pw);
        await GH.putFile('docs/vault.enc', JSON.stringify(blob), null, 'skarbiec: założono');
        $('#app').innerHTML = `<div class="login"><div class="card stack"><h2>✓ Skarbiec założony</h2>
          <p style="margin:0">Ostatni krok na GitHubie: <b>Settings → Secrets and variables → Actions → New repository secret</b></p>
          <p style="margin:0">Nazwa: <code>SKARBIEC_PASSWORD</code>, wartość: <b>to samo hasło</b>. Bez tego bot nie odczyta twoich list.</p>
          <p style="margin:0">Potem odśwież tę stronę i zaloguj się.</p><button class="btn primary" onclick="location.reload()">Odśwież</button></div></div>`;
        return;
      }
      await unlock($('#l-pw').value, $('#l-rem').checked);
    } catch (err) { loginScreen(err.message, setup); }
  });
}

async function unlock(pw, remember) {
  let blob = null;
  S.readOnly = true;
  if (GH.token && GH.repo) {
    try { const f = await GH.getFile('docs/vault.enc'); if (f) { blob = JSON.parse(f.text); S.vaultSha = f.sha; S.readOnly = false; } }
    catch (e) { console.warn('GitHub API:', e.message); }
  }
  if (!blob) blob = await fetchPublic('vault.enc');
  if (!blob) throw new Error('Nie znalazłem skarbca.');
  try { const r = await decryptBlob(blob, pw); S.vault = r.obj; S.vaultSalt = r.salt; }
  catch { ls.set('skarbiec_pw', null); throw new Error('Złe hasło.'); }
  S.vault.watchlists ||= []; S.vault.portfolio ||= [];
  S.vaultSaved = JSON.stringify(S.vault);
  S.pw = pw;
  if (remember) ls.set('skarbiec_pw', pw);
  const [mBlob, meta] = await Promise.all([fetchPublic('market.enc').catch(() => null), fetchPublic('meta.json').catch(() => null)]);
  S.meta = meta;
  S.market = mBlob ? (await decryptBlob(mBlob, pw).catch(() => ({ obj: null }))).obj : null;
  S.market ||= { h: {}, fx: {}, pv: [], alerts: [], state: {} };
  shell();
  loadCatalog().then(() => { if (S.tab !== 'rynek') render(); }).catch(() => {});
  loadEN().then(() => { if (S.en?.size && ['watch', 'portfel'].includes(S.tab)) render(); });
  loadCatalog().catch(() => {}).then(syncTargets);
}

(async function start() {
  const th = ls.get('skarbiec_theme'); if (th) document.documentElement.dataset.theme = th;
  $('#app').innerHTML = '<div class="login"><span class="spin"></span></div>';
  try {
    const exists = await fetchPublic('vault.enc');
    if (!exists) return loginScreen('', true);
    const saved = ls.get('skarbiec_pw');
    if (saved) { try { await unlock(saved, true); return; } catch {} }
    loginScreen('');
  } catch (e) { loginScreen(e.message); }
})();
</script>
